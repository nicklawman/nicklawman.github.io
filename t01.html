const records = [{"pat_no": "US10009844", "ai_check": "# 發明概述\n## 要解決的技術問題\n本發明主要處理DRX機制中短週期與長週期切換控制的細化問題，特別是在不同傳輸活動情境下，如何透過控制訊號精確決定終端應使用何種DRX cycle，以在功耗與即時性間取得更佳平衡。\n\n## 技術手段\n首先，終端依據DRX on-duration timer與inactivity timer控制PDCCH監聽行為。\n\n其次，透過RRC配置，使終端具備short DRX cycle與long DRX cycle能力。\n\n最後，透過MAC CE（具有不同type）來指示終端選擇短或長DRX週期。\n\n## 技術效果\n可透過MAC層即時控制DRX週期切換，提高系統彈性，並改善功耗與延遲之折衷。\n\n# claim 1\n## claim 1文字：\nA method for a wireless transmit receive unit (WTRU) to perform discontinuous reception (DRX), the method comprising: the WTRU operating a DRX on duration timer, wherein the DRX on duration timer specifies a number of consecutive physical downlink control channel (PDCCH) subframes at a beginning of a DRX cycle; the WTRU operating a DRX inactivity timer, wherein the DRX inactivity timer is indicative of a number of consecutive transmission time intervals (TTIs) during which the WTRU monitors a PDCCH after successfully decoding a PDCCH transmission that indicates an initial uplink or downlink user data transmission for the WTRU; the WTRU receiving a configuration indicating that the WTRU is configured for a short cycle; the WTRU receiving a DRX medium access control (MAC) control element (CE); on a condition that the received DRX MAC CE is of a first type, the WTRU using a short DRX cycle; and on a condition that the received DRX MAC CE is of a second type, the WTRU using a long DRX cycle.\n\n## 特徵001: 「the WTRU operating a DRX on duration timer」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.321 V8.0.0 (Release 8 MAC specification)\n\n### 時間比較：\n版本凍結約2007年底至2008年初，早於或至少不晚於2008-03-14\n\n### 說明：\n明確定義onDurationTimer作為DRX基本參數。\n\n---\n\n## 特徵002: 「DRX on duration timer specifies a number of consecutive PDCCH subframes」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.321 V8.x（DRX operation）\n\n### 時間比較：\nRelease 8（2007–2008），早於或同期priority date\n\n### 說明：\nonDurationTimer定義為連續subframes監聽PDCCH。\n\n---\n\n## 特徵003: 「operating a DRX inactivity timer」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.321 V8.0.0\n\n### 時間比較：\n同上\n\n### 說明：\ninactivityTimer為DRX標準核心機制。\n\n---\n\n## 特徵004: 「monitors a PDCCH after successfully decoding a PDCCH transmission」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.321 + TS 36.213（Release 8）\n\n### 時間比較：\n2007–2008\n\n### 說明：\n成功解碼後延長監聽為DRX既定邏輯。\n\n---\n\n## 特徵005: 「receiving a configuration ... configured for a short cycle」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V8.0.0 (RRC specification)\n\n### 時間比較：\nRelease 8（約2008），早於或同期priority date\n\n### 說明：\nRRC已支援short/long DRX cycle配置。\n\n---\n\n## 特徵006: 「receiving a DRX MAC CE」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.321 V8.0.0（DRX Command MAC CE）\n\n### 時間比較：\n同上\n\n### 說明：\nMAC CE用於控制DRX行為（如停止onDuration）。\n\n---\n\n## 特徵007: 「MAC CE is of a first type ... using a short DRX cycle」\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n尚未找到明確文獻指出MAC CE“type”直接對應short DRX cycle\n\n### 時間比較：\n不適用\n\n### 說明：\n標準僅定義DRX Command（單一控制），未明確定義多type對應short/long切換。\n\n---\n\n## 特徵008: 「MAC CE is of a second type ... using a long DRX cycle」\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n同上\n\n### 時間比較：\n不適用\n\n### 說明：\nshort/long cycle切換多由RRC配置或內部狀態決定，非MAC CE type明確控制。\n\n---\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001–006（完整DRX機制）\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  無\n- 暫未找到對應揭露的特徵：\n  特徵007–008（MAC CE type對應cycle切換）\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  核心差異集中於MAC CE type控制DRX cycle，若無具體揭露，可能具有限度新穎性，但整體仍屬既有DRX架構延伸，顯而易見性偏高。\n\n---\n\n# claim 6\n## claim 6文字：\nA wireless transmit receive unit (WTRU) comprising: a processor that is configured to at least: operate a DRX on duration timer, wherein the DRX on duration timer specifies a number of consecutive physical downlink control channel (PDCCH) subframes at a beginning of a DRX cycle; operate a DRX inactivity timer, wherein the DRX inactivity timer is indicative of a number of consecutive transmission time intervals (TTIs) during which the WTRU monitors a PDCCH after successfully decoding a PDCCH transmission that indicates an initial uplink or downlink user data transmission for the WTRU; receive a configuration indicating that the WTRU is configured for a short cycle; receive a DRX medium access control (MAC) control element (CE); on a condition that the received DRX MAC CE is of a first type, use a short DRX cycle; and on a condition that the received DRX MAC CE is of a second type, use a long DRX cycle.\n\n## 特徵001: 「a wireless transmit receive unit (WTRU)」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.300 V8.0.0\n\n### 時間比較：\n2007–2008\n\n### 說明：\nUE/WTRU為標準設備。\n\n---\n\n## 特徵002: 「a processor configured to operate DRX on duration timer」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nTS 36.321 + UE implementation\n\n### 時間比較：\n同上\n\n---\n\n## 特徵003: 「operate a DRX inactivity timer」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nTS 36.321\n\n---\n\n## 特徵004: 「receive configuration ... short cycle」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nTS 36.331\n\n---\n\n## 特徵005: 「receive a DRX MAC CE」\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nTS 36.321\n\n---\n\n## 特徵006: 「first type / second type control short/long DRX」\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n尚未找到明確標準或專利揭露\n\n---\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001–005\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  無\n- 暫未找到對應揭露的特徵：\n  特徵006\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  裝置claim與method一致，差異仍在MAC CE type控制，整體顯而易見性仍高。\n\n# 總體結論\n- 已找到具體且早於 priority_date 的文獻支持：\n  LTE DRX完整機制（TS 36.321、36.331）\n- 僅能合理推測但尚未找到具體文獻：\n  無\n- 暫未找到對應揭露：\n  MAC CE type控制short/long DRX cycle\n- 整體新穎性 / 顯而易見性的初步判斷：\n  僅有局部控制方式差異，整體仍為既有DRX機制延伸，**顯而易見性高，新穎性有限**"}, {"pat_no": "US10021671", "ai_check": "# 發明概述\n## 要解決的技術問題\n本案核心在於：當UE可接收之頻寬小於網路整體傳輸頻寬時，傳統將paging集中在固定位置的做法，可能迫使UE在接收paging時進行重新調諧，增加複雜度與功耗；因此本案試圖解決如何讓UE在較窄接收頻寬下，仍能於特定頻域位置接收paging indication／paging message的問題。此問題設定與同族早期揭露中所述「UE bandwidth smaller than cell/network transmission bandwidth」及需在頻域中決定paging position的背景一致。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n## 技術手段\n第一，基地台以broadcast channel message提供一個「paging position in the frequency domain」之指示，該位置對應於整體網路傳輸頻寬中的一部分頻寬，供UE知道應在哪個頻域位置監聽paging indication。此種「以廣播資訊告知UE其頻域paging位置」的思路，與同族早期揭露所述「system information (transmitted on the broadcast channel) indicat[ing] the preferred paging positions」高度接近。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n第二，UE僅於該paging position監聽paging indications，而非監聽整個network transmission bandwidth；若接收到paging indication，則再接收後續paging相關訊息。此種兩步式paging（paging indication後接paging message）在後來的802.16m系統說明文件中亦可見到，但其公開時間晚於本案優先權日，因此僅可作技術脈絡參考，不可作本案前案。([ieee802.org](https://ieee802.org/16/tgm/docs/80216m-08_003r9a.pdf?utm_source=chatgpt.com))\n\n第三，基地台端對應地在該paging position發送paging indication與paging message，使UE可在其受限接收頻寬內完成paging接收，而不必為了監聽paging而跨整個系統頻寬重新調諧。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n## 技術效果\n其主要效果在於：將paging接收限制於較小的頻域位置，可降低UE接收鏈負擔與重調諧需求，對於「UE可接收頻寬小於網路傳輸頻寬」的寬頻OFDMA／E-UTRA場景尤其有利。此效果亦與同族早期揭露中「prevented that the user equipment needs to re-tune its receiver」的描述一致。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n# claim 1\n## claim 1文字：\nA method implemented by a user equipment (UE), the method comprising: the UE receiving a broadcast channel message, the broadcast channel message comprising an indication of a paging position in the frequency domain that is to be used by the UE to receive paging indications, wherein a bandwidth of the paging position in the frequency domain corresponds to a subset of a network transmission bandwidth in the frequency domain; the UE monitoring for paging indications at the paging position; and the UE receiving a paging indication at the paging position.\n\n## 特徵001: “the UE receiving a broadcast channel message”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TR 25.814 V7.1.0（Release 7 Study on Physical Layer Aspects for Evolved UTRA），2006-09；3GPP TR 25.912 V7.2.0（Feasibility Study for Evolved UTRA and UTRAN），2007-06。\n\n### 時間比較：\nTR 25.814 V7.1.0 公開時間為2006-09，晚於priority date 2006-08-22，故不能單獨作為「早於priority date」的直接前案。TR 25.912 V7.2.0 更晚，亦不能作為早於priority date之前案。([freecalypso.org](https://www.freecalypso.org/pub/GSM/3GPP/archive/25_series/25.814/25814-710.pdf?utm_source=chatgpt.com))\n\n### 說明：\n上述文件可證明：在E-UTRA技術形成早期，BCH／broadcast channel作為UE取得系統資訊的架構已被明確認知；但就本題要求，暫未找到「早於2006-08-22」且明確寫出本特徵的具體標準文件。故較穩健的表述應為：暫無法確認早於priority date的具體文獻，但從技術脈絡看，此部分很可能屬既有無線系統基本架構。([freecalypso.org](https://www.freecalypso.org/pub/GSM/3GPP/archive/25_series/25.814/25814-710.pdf?utm_source=chatgpt.com))\n\n## 特徵002: “the broadcast channel message comprising an indication of a paging position in the frequency domain that is to be used by the UE to receive paging indications”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n目前找到最接近者為EP2055131B1／其Google Patents頁面所示內容，記載「system information (transmitted on the broadcast channel) [indicates] the preferred paging positions where the user equipment shall tune itself」以及「the user equipment in idle mode ... receives a broadcast message from the Node B with UE position-related information」。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n### 時間比較：\nEP2055131B1頁面所載內容屬該專利家族後續公開內容，公開時間明顯晚於2006-08-22，不能作為本案前案。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n### 說明：\n我目前未找到早於priority date的3GPP/IEEE標準、專利或論文，明確揭露「由broadcast channel message指示頻域paging position」這一點。這是本案相對關鍵、且目前未能以具體前案坐實的特徵。\n\n## 特徵003: “wherein a bandwidth of the paging position in the frequency domain corresponds to a subset of a network transmission bandwidth in the frequency domain”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS20100040015A1（Using a synchronization channel to send quick paging signals）揭露「a first set of contiguous subcarriers corresponding to part of an entire available frequency bandwidth」以及quick paging signal位於不同frequency sub-band；另同族後續揭露明確討論「UE bandwidth smaller than cell transmission bandwidth」與UE僅位於部分頻域位置接收paging。([patents.google.com](https://patents.google.com/patent/US20100040015A1))\n\n### 時間比較：\nUS20100040015A1之priority date為2008-08-13、publication date為2010-02-18，晚於priority date 2006-08-22，不能作為本案前案。([patents.google.com](https://patents.google.com/patent/US20100040015A1))\n\n### 說明：\n從OFDMA/寬頻系統技術演進看，「僅在整體頻寬的一部分子頻帶承載同步/快速paging相關訊號」屬合理技術方向；但我目前未找到早於2006-08-22的具體文獻可直接對應本特徵，因此只能列為「可能已揭露」。\n\n## 特徵004: “the UE monitoring for paging indications at the paging position”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nIEEE 802.16e-2005（2006-02正式出版）已具備idle mode paging概念，相關提案文件C802.16e-05/075（2005-01-10）描述MSS在paging listening interval接收MOB-PAG-ADV。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 時間比較：\nIEEE 802.16e-2005於2006-02出版，早於2006-08-22；C802.16e-05/075為2005-01-10，亦早於priority date。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 說明：\n這些來源可支持「UE/MSS在特定paging listening時機監聽paging indication」本身屬既有；但其是否明確為「at the paging position」亦即特定頻域位置，則未見同等明確揭露。因此僅能部分支持本特徵。\n\n## 特徵005: “the UE receiving a paging indication at the paging position”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nIEEE 802.16e-2005與其相關提案已揭露paging indication（例如MOB-PAG-ADV）；另802.16m SDD draft中明確寫有two-step paging procedure with paging indication followed by full paging message，但其時間較晚。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 時間比較：\n802.16e-2005早於2006-08-22；但802.16m SDD draft為2009年，晚於priority date。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 說明：\n「接收paging indication」本身在priority date前應已有具體基礎；但「at the paging position」這個頻域位置限定，我目前仍未找到早於priority date的直接文獻。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  “monitoring for paging indications” 與 “receiving a paging indication” 的一般paging概念，可由IEEE 802.16e-2005及其2005提案部分支持。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  “wherein a bandwidth of the paging position ... corresponds to a subset of a network transmission bandwidth”；\n  “monitoring ... at the paging position”；\n  “receiving a paging indication at the paging position”。([patents.google.com](https://patents.google.com/patent/US20100040015A1))\n- 暫未找到對應揭露的特徵：\n  “broadcast channel message comprising an indication of a paging position in the frequency domain ...”\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  若嚴格以前案證據看，claim 1中最關鍵的「broadcast指示頻域paging位置，且該位置僅占整體頻寬子集」目前未找到早於2006-08-22的直接文獻，因此新穎性不宜輕率否定；但若從技術組合脈絡觀察，既有paging＋OFDMA子頻帶配置＋廣播系統資訊的結合，後續看起來屬自然延伸，故顯而易見性仍有可攻擊空間。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n# claim 11\n## claim 11文字：\nA user equipment (UE) comprising: a receiver configured to receive a broadcast channel message, the broadcast channel message comprising an indication of a paging position in the frequency domain that is to be used by the UE to receive paging indications, wherein a bandwidth of the paging position in the frequency domain corresponds to a subset of a network transmission bandwidth in the frequency domain; a processor configured to: monitor, via the receiver, for paging indications at the paging position, and receive, via the receiver, a paging indication at the paging position.\n\n## 特徵001: “a receiver configured to receive a broadcast channel message”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nE-UTRA早期研究文件TR 25.814、TR 25.912反映UE透過BCH/廣播資訊取得系統資訊；802.16e-2005亦有MS接收廣播/控制訊息之一般架構。([freecalypso.org](https://www.freecalypso.org/pub/GSM/3GPP/archive/25_series/25.814/25814-710.pdf?utm_source=chatgpt.com))\n\n### 時間比較：\n可具體點名且明確可核對的E-UTRA文件均晚於priority date；802.16e-2005早於priority date，但未直接對應本案之「broadcast channel message + paging position」。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 說明：\n裝置中的receiver接收廣播訊息屬常見架構，但目前未找到早於2006-08-22且精準對應本案語句的單一文獻。\n\n## 特徵002: “the broadcast channel message comprising an indication of a paging position in the frequency domain”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n目前最接近仍是EP2055131B1家族之後續公開內容，但其時間晚於priority date。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n### 時間比較：\n晚於2006-08-22。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n### 說明：\n此仍是claim 11最關鍵、且目前未找到明確前案的部分。\n\n## 特徵003: “wherein a bandwidth of the paging position in the frequency domain corresponds to a subset of a network transmission bandwidth in the frequency domain”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS20100040015A1後續揭露了將quick paging signal配置於整體頻寬之一部分子頻帶的思路；同族後續揭露則直接處理UE bandwidth smaller than network bandwidth的paging positioning。([patents.google.com](https://patents.google.com/patent/US20100040015A1))\n\n### 時間比較：\n兩者皆晚於priority date。([patents.google.com](https://patents.google.com/patent/US20100040015A1))\n\n### 說明：\n此特徵技術上並非突兀，但目前未找到早於priority date的具體文件。\n\n## 特徵004: “monitor ... for paging indications at the paging position”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nIEEE 802.16e-2005 idle mode paging / MOB-PAG-ADV。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 時間比較：\n早於2006-08-22。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 說明：\n可支持「monitor for paging indications」的一般概念；但「at the paging position」仍缺直接前案。\n\n## 特徵005: “receive ... a paging indication at the paging position”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\n同上，另UMTS/UTRA在更早期亦已有paging channel/paging indicator channel概念，但本次檢索未找到早於priority date且直接對應頻域位置限制的具體文件。3GPP R1-99863至少顯示更早即存在paging indicator channel分離的思路。([3gpp.org](https://www.3gpp.org/ftp/tsg_ran/wg1_rl1/TSGR1_06/Docs/Pdfs/r1-99863.PDF?utm_source=chatgpt.com))\n\n### 時間比較：\nR1-99863為1999年，早於priority date；802.16e-2005亦早於priority date。([3gpp.org](https://www.3gpp.org/ftp/tsg_ran/wg1_rl1/TSGR1_06/Docs/Pdfs/r1-99863.PDF?utm_source=chatgpt.com))\n\n### 說明：\n裝置claim基本上是claim 1的方法特徵之裝置化表述，實質差異不大。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  一般paging indication監聽/接收、裝置具有receiver/processor執行paging接收之概念。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  子頻寬paging position、在該特定頻域位置接收paging indication。([patents.google.com](https://patents.google.com/patent/US20100040015A1))\n- 暫未找到對應揭露的特徵：\n  由broadcast channel message明確指示paging position in the frequency domain。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  與claim 1相同，整體概念有相當強的技術延伸性，但關鍵配置訊息的前案證據仍不足，故新穎性目前較難直接否定。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n# claim 20\n## claim 20文字：\nA base station comprising: a transmitter configured to a broadcast channel message, the broadcast channel message comprising an indication of a paging position in the frequency domain that is to be used by a user equipment to receive paging indications, wherein a bandwidth of the paging position in the frequency domain corresponds to a subset of a network transmission bandwidth in the frequency domain; and a processor configured to: send, via the transmitter, a paging indication to the user equipment at the paging position, and send, via the transmitter, a paging message to the user equipment at the paging position.\n\n## 特徵001: “a transmitter configured to a broadcast channel message”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nE-UTRA研究文件已明示BCH/廣播系統資訊機制；基地台發送broadcast information屬標準系統基本架構。([freecalypso.org](https://www.freecalypso.org/pub/GSM/3GPP/archive/25_series/25.814/25814-710.pdf?utm_source=chatgpt.com))\n\n### 時間比較：\n本次能明確點名的E-UTRA文件均晚於priority date。([freecalypso.org](https://www.freecalypso.org/pub/GSM/3GPP/archive/25_series/25.814/25814-710.pdf?utm_source=chatgpt.com))\n\n### 說明：\n具體到本claim語境，仍缺早於priority date的精確文件。\n\n## 特徵002: “the broadcast channel message comprising an indication of a paging position in the frequency domain ... subset of a network transmission bandwidth”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n目前最接近者仍為EP2055131B1家族後續揭露。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n### 時間比較：\n晚於priority date。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n\n### 說明：\n這是基地台claim的關鍵差異特徵，前案證據仍不足。\n\n## 特徵003: “send ... a paging indication to the user equipment at the paging position”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nIEEE 802.16e-2005 / C802.16e-05/075可支持基地台發送paging indication的一般概念；同族後續內容則直接寫到「the base station will then send the paging for that particular user equipment at that particular paging position」。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 時間比較：\n802.16e-2005與2005提案早於priority date；但後者與“at that particular paging position”最直接的文字出處晚於priority date。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n\n### 說明：\n一般「發送paging indication」在前案中較易成立；但「發到特定頻域paging position」這一點，仍未找到priority date前的直接文件。\n\n## 特徵004: “send ... a paging message to the user equipment at the paging position”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\n802.16m 2009 SDD draft明載two-step paging：paging indication followed by full paging message；同族後續揭露亦寫有「both the paging indicator and the paging message are sent within the UE reception bandwidth」。([ieee802.org](https://ieee802.org/16/tgm/docs/80216m-08_003r9a.pdf?utm_source=chatgpt.com))\n\n### 時間比較：\n上述最接近的直接文句均晚於priority date。([ieee802.org](https://ieee802.org/16/tgm/docs/80216m-08_003r9a.pdf?utm_source=chatgpt.com))\n\n### 說明：\n因此，雖然「paging indication + paging message」的二段式概念後續相當自然，但目前仍未找到早於priority date且直接對應本特徵的具體前案。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  基地台發送paging indication的一般概念。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  在「特定頻域paging position」上發送paging indication / paging message。([patents.google.com](https://patents.google.com/patent/EP2055131B1/en))\n- 暫未找到對應揭露的特徵：\n  以broadcast channel message指示該頻域paging position且其頻寬為network transmission bandwidth之子集。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  claim 20與claim 1/11本質對應，真正關鍵仍是「broadcast配置＋頻域paging位置＋子頻寬監聽/發送」這組合，目前未見priority date前的直接文件。\n\n# 總體結論\n- 已找到具體且早於 priority_date 的文獻支持：\n  1. 一般paging / paging indication概念：IEEE 802.16e-2005（2006-02）及其2005提案可支持。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))\n  2. 更早期3GPP已有paging indicator channel分離思路：R1-99863（1999）。([3gpp.org](https://www.3gpp.org/ftp/tsg_ran/wg1_rl1/TSGR1_06/Docs/Pdfs/r1-99863.PDF?utm_source=chatgpt.com))\n- 僅能合理推測但尚未找到具體文獻：\n  1. 將paging indication / paging message限制於整體傳輸頻寬的一個子頻帶；\n  2. UE僅在該paging position監聽；\n  3. 基地台在該paging position發paging indication/message。([patents.google.com](https://patents.google.com/patent/US20100040015A1))\n- 暫未找到對應揭露：\n  1. 「broadcast channel message」明確包含「paging position in the frequency domain」指示；\n  2. 該paging position之頻寬明確為network transmission bandwidth之subset，且這些內容有priority date前的具體標準/專利/論文支持。\n- 整體新穎性 / 顯而易見性的初步判斷：\n  以目前可具體點名且能確認時間的材料看，本案**不宜直接下結論為大多數特徵已被priority date前完整揭露**。較穩健的初步判斷是：  \n  1. 一般paging、paging indication、廣播系統資訊、以及受限頻寬UE的系統背景，已有明顯既有技術基礎；  \n  2. 但本案關鍵的「broadcast指示特定頻域paging位置，且該位置僅為整體網路頻寬子集」目前未找到priority date前的直接文獻；  \n  3. 因此**新穎性目前仍有一定主張空間**；至於**顯而易見性**，則可能會被主張為由既有paging機制、OFDMA子頻帶配置、以及窄頻寬UE支援需求所推導，但這需要更深入檢索2005–2006年間的E-UTRA RAN1/RAN2提案、早期WiMAX/UMB/OFDMA paging專利與標準草案後，才能更有把握地下結論。([people.computing.clemson.edu](https://people.computing.clemson.edu/~jmarty/projects/WiMAX/802.16e-2005.pdf?utm_source=chatgpt.com))"}, {"pat_no": "US10028200", "ai_check": "# 發明概述\n## 要解決的技術問題\n本案主要在處理多RAT並行操作時的控制面管理問題：當WTRU已在第一RAT建立RRC連線並透過第一SRB傳送第一RAT格式的RRC資訊後，如何由第一RAT下發包含第二RAT配置資訊的訊息，使WTRU得以建立第二RAT之控制面資源（如第二SRB），並進一步同時使用兩個不同RAT通信。\n\n## 技術手段\n其一，WTRU先在第一RAT的第一小區建立連線，並以第一RAT既有的RRC格式及第一SRB承載控制訊息。\n\n其二，第一RAT再向WTRU傳送RRC reconfiguration message，該訊息內含一個container，用以攜帶第二RAT的配置資訊；依claim文字，該第二RAT配置資訊進一步包括第二SRB的建立資訊。\n\n其三，WTRU依該reconfiguration內容完成第二RAT之配置，之後同時使用第一RAT與第二RAT通信。\n\n## 技術效果\n其效果在於可避免完全獨立地重新建立第二套控制流程，改由既有第一RAT連線承載對第二RAT的配置下發，提升多RAT協同操作的整合度與控制效率，並支援雙RAT同時通信。\n\n# claim 1\n## claim 1文字：\n1. A wireless transmit/receive unit (WTRU) comprising: a transceiver and a processor configured to establish a connection with a first cell of a first radio access technology (RAT), wherein the WTRU communicates radio resource control (RRC) information having a first RRC format of the first RAT using a first signaling radio bearer (SRB); the transceiver is further configured to receive from the first RAT a RRC reconfiguration message including a container having configuration information for a second RAT, wherein the configuration information for the second RAT includes establishment information for a second SRB, wherein the first RAT and the second RAT are different RATs; and the transceiver and the processor are configured to communicate using both the first RAT and the second RAT.\n\n## 特徵001: “establish a connection with a first cell of a first radio access technology (RAT)”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V10.0.0（Release 10, 2011-01）定義LTE RRC連線與相關程序；US10028200B2專利頁面亦顯示本案prior art date為2011-07-29。\n\n### 時間比較：\n3GPP TS 36.331 V10.0.0發布時間為2011-01，早於priority date 2011-07-29。\n\n### 說明：\n在第一RAT之第一小區建立RRC連線，屬LTE/3GPP既有基本控制面機制。\n\n## 特徵002: “the WTRU communicates radio resource control (RRC) information having a first RRC format of the first RAT using a first signaling radio bearer (SRB)”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V10.0.0第4.2.2節明確定義SRB0/SRB1/SRB2，並指出SRB係用於RRC/NAS訊息；同規格並定義RRCConnectionReconfiguration、MobilityFromEUTRACommand等RRC訊息皆經SRB/DCCH承載。\n\n### 時間比較：\nTS 36.331 V10.0.0為2011-01，早於2011-07-29。\n\n### 說明：\n「以第一RAT的RRC格式，透過第一SRB承載RRC資訊」本身屬標準既有設計。\n\n## 特徵003: “receive from the first RAT a RRC reconfiguration message”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V10.0.0明確定義RRCConnectionReconfiguration message；另其規定該訊息由E-UTRAN送往UE。\n\n### 時間比較：\nTS 36.331 V10.0.0為2011-01，早於priority date。\n\n### 說明：\n由第一RAT送出RRC reconfiguration message，本身不是新特徵。\n\n## 特徵004: “including a container having configuration information for a second RAT”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V10.0.0已存在inter-RAT相關container/transparent container概念，例如MobilityFromEUTRACommand用於由E-UTRA命令切換至另一RAT；WO2011067459A1（Architecture providing multi-system carrier aggregation，公開日2011-06-09）亦揭露由一個RAT的RRC端點向UE提供另一系統的RRC參數，且訊息流程中提到“parameters are included in a container”並由既有RRC架構向UE提供。\n\n### 時間比較：\nTS 36.331 V10.0.0為2011-01；WO2011067459A1公開日為2011-06-09；兩者均早於2011-07-29。\n\n### 說明：\n若僅看「container攜帶第二RAT配置資訊」這一概念，已有相當接近的inter-RAT container與multi-system carrier aggregation揭露；但我尚未找到priority date前、完全對應到“RRC reconfiguration message內含第二RAT configuration container”的單一文獻，因此較穩健評為「可能已揭露」。\n\n## 特徵005: “wherein the configuration information for the second RAT includes establishment information for a second SRB”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n暫未找到早於2011-07-29且明確揭露「第一RAT的reconfiguration message中，第二RAT配置資訊進一步包含第二SRB建立資訊」的具體標準文件、專利或論文。\n\n### 時間比較：\n不適用。\n\n### 說明：\n雖然3GPP TS 36.331已明確存在SRB概念，且multi-RAT/跨系統配置亦已有相近揭露，但「第二RAT的第二SRB establishment information由第一RAT reconfiguration container下發」這一組合，我目前未找到priority date前的直接文獻。\n\n## 特徵006: “wherein the first RAT and the second RAT are different RATs”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nWO2011067459A1明確以E-UTRAN與UTRAN等不同air interfaces/不同無線系統進行multi-system carrier aggregation；US10028200B2專利頁面之說明亦列舉WCDMA、LTE、IEEE 802.16、IEEE 802.11等多RAT操作場景。\n\n### 時間比較：\nWO2011067459A1公開日為2011-06-09，早於priority date。\n\n### 說明：\n不同RAT並行或聚合操作的概念，在priority date前已有具體公開。\n\n## 特徵007: “the transceiver and the processor are configured to communicate using both the first RAT and the second RAT”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nWO2011067459A1明確揭露以不同air interfaces之兩個無線系統同時/並行提供radio bearer或共同服務同一UE；其並指出一個RB可由兩個RAT同時服務，或UE可透過不同RAT進行通信。\n\n### 時間比較：\nWO2011067459A1公開日2011-06-09，早於2011-07-29。\n\n### 說明：\n「同時使用第一RAT與第二RAT通信」在multi-system carrier aggregation脈絡下已有具體揭露。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001、002、003、006、007\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  特徵004\n- 暫未找到對應揭露的特徵：\n  特徵005\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本claim前半部（第一RAT連線、第一SRB、RRC reconfiguration）與後半部（雙RAT通信）多可由2011-07-29前之3GPP標準及WO2011067459A1支持；較關鍵且目前最難直接坐實者，在於「第一RAT的reconfiguration container內，明確包含第二RAT之第二SRB建立資訊」。因此，本claim之新穎性未必可直接完全否定，但整體顯而易見性已有相當可主張空間。\n\n# claim 10\n## claim 10文字：\n10. A method performed by a wireless transmit/receive unit (WTRU) comprising: establishing a connection with a first cell of a first radio access technology (RAT), wherein the WTRU communicates radio resource control (RRC) information having a first RRC format of the first RAT using a first signaling radio bearer (SRB); receiving from the first RAT a RRC reconfiguration message including a container having configuration information for a second RAT, wherein the configuration information for the second RAT includes establishment information for a second SRB, wherein the first RAT and the second RAT are different RATs; and communicating using both the first RAT and the second RAT.\n\n## 特徵001: “establishing a connection with a first cell of a first radio access technology (RAT)”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V10.0.0。\n\n### 時間比較：\n2011-01，早於2011-07-29。\n\n### 說明：\n與claim 1相同，屬既有RRC連線建立背景。\n\n## 特徵002: “the WTRU communicates radio resource control (RRC) information having a first RRC format of the first RAT using a first signaling radio bearer (SRB)”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V10.0.0第4.2.2節與RRC訊息定義。\n\n### 時間比較：\n2011-01，早於priority date。\n\n### 說明：\n第一RAT以第一SRB傳送第一RAT格式之RRC資訊，屬標準既有內容。\n\n## 特徵003: “receiving from the first RAT a RRC reconfiguration message”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V10.0.0的RRCConnectionReconfiguration。\n\n### 時間比較：\n2011-01，早於priority date。\n\n### 說明：\n此部分本身無新穎性。\n\n## 特徵004: “including a container having configuration information for a second RAT”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V10.0.0的inter-RAT container/transparent container機制；WO2011067459A1之container與另一系統RRC參數提供機制。\n\n### 時間比較：\n2011-01與2011-06-09，皆早於2011-07-29。\n\n### 說明：\n可找到接近脈絡，但未找到完全相同語義之單一前案。\n\n## 特徵005: “wherein the configuration information for the second RAT includes establishment information for a second SRB”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n暫未找到priority date前的具體標準文件、專利或論文可直接對應。\n\n### 時間比較：\n不適用。\n\n### 說明：\n此為本claim最可能的差異焦點。\n\n## 特徵006: “wherein the first RAT and the second RAT are different RATs”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nWO2011067459A1。\n\n### 時間比較：\n2011-06-09，早於priority date。\n\n### 說明：\n不同RAT之協同通信在prior art中已明確存在。\n\n## 特徵007: “communicating using both the first RAT and the second RAT”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nWO2011067459A1。\n\n### 時間比較：\n2011-06-09，早於2011-07-29。\n\n### 說明：\n雙RAT並行通信或聚合傳輸並非本案首創。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001、002、003、006、007\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  特徵004\n- 暫未找到對應揭露的特徵：\n  特徵005\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  claim 10與claim 1本質相同，差別僅在裝置/方法表述。其主要潛在差異仍集中在「第二RAT配置資訊中包含第二SRB建立資訊」這一點；若後續檢索到更接近的2010–2011 inter-RAT CA/DC專利或RAN2提案，顯而易見性風險會進一步上升。\n\n# 總體結論\n- 已找到具體且早於 priority_date 的文獻支持：\n  1. 第一RAT建立RRC連線、RRC訊息經SRB承載、RRCConnectionReconfiguration等基本控制面機制：3GPP TS 36.331 V10.0.0。\n  2. 不同RAT並行通信、single/common upper layer或single RRC anchor下之multi-system carrier aggregation：WO2011067459A1。\n- 僅能合理推測但尚未找到具體文獻：\n  1. 第一RAT的RRC reconfiguration message內含second RAT configuration container之精確訊息形態。\n- 暫未找到對應揭露：\n  1. 第二RAT配置資訊明確包含第二SRB establishment information。\n- 整體新穎性 / 顯而易見性的初步判斷：\n  以目前可具體點名且可確認時間的文獻看，本案多數高階概念已在priority date前存在：第一RAT既有RRC/SRB控制面、不同RAT並行通信、以及透過container/跨系統參數傳遞進行multi-RAT整合。真正較難直接以前案坐實的，是「第二RAT之第二SRB建立資訊由第一RAT的RRC reconfiguration container下發」這個較細部的控制面實作。因此，現階段較穩健的初步判斷是：本案整體新穎性未必可直接完全否定，但顯而易見性已有相當強的挑戰空間，尤其若進一步檢索到2010–2011年間RAN2提案、Nokia/Qualcomm/InterDigital同類multi-RAT carrier aggregation或single-RRC控制面專利，風險可能更高。"}, {"pat_no": "US10034006", "ai_check": "# 發明概述\n## 要解決的技術問題\n本案主要處理變換係數顯著性（coefficient significance）之表示與編碼效率問題。核心想法是：相較於逐一傳送每個掃描係數是否為非零，若能利用樹狀結構／子樹結構來表達一組掃描係數的顯著性地圖（significance map），並在樹節點層級區分需處理的零與非零，可望減少符號數量、提升編解碼效率。\n\n## 技術手段\n其一，對圖像區塊之變換係數建立顯著性地圖，並以一個或多個樹狀結構表示該顯著性資訊，而非僅以單純線性掃描旗標逐點表示。\n\n其二，將顯著性資訊映射到樹節點，並以子樹對應特定掃描係數集合或顯著性地圖的一部分，使部分節點用於處理非零，部分節點用於處理零。\n\n其三，另以一旗標表示該區塊至少存在一個顯著係數，並在編碼器／解碼器／方法／媒體等不同請求項中，將上述結構套用到編碼、解碼及比特流表示。\n\n## 技術效果\n若樹狀結構能有效捕捉係數顯著性的空間／層級聚集性，理論上可減少顯著性地圖的編碼負擔，降低比特數，並提升大區塊或稀疏係數分布下的壓縮效率。\n\n# claim 1\n## claim 1文字：\n1. An apparatus, comprising: a video encoder for encoding picture data for a block in a picture, wherein one or more tree structures are used to encode a binary set of data for indicating coefficient significance for the block, the one or more tree structures, comprising one or more sub-trees, each having a plurality of nodes, wherein, a set of sub-trees is used to encode a particular part of a significance map, said significance map indicating coefficient significance for the block, wherein each sub-tree is a data structure used to convey a particular significance map for a set of scanned coefficients, the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions, and wherein some nodes of the tree structures are processed to encode non-zeros, while other nodes of the tree structures are processed to encode zeros, and a flag indicates at least one significant coefficient in said block corresponding to the significance map.\n\n## 特徵001: “a video encoder for encoding picture data for a block in a picture”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nMarpe, Schwarz, Wiegand, “Context-based adaptive binary arithmetic coding in the H.264/AVC video compression standard,” IEEE Transactions on Circuits and Systems for Video Technology, Vol. 13, No. 7, July 2003.\n\n### 時間比較：\n2003-07，早於 priority date 2009-07-02。\n\n### 說明：\n該文明確說明以區塊為單位對變換係數與殘差資料進行編碼，屬本特徵之直接既有背景。\n\n## 特徵002: “one or more tree structures are used to encode a binary set of data for indicating coefficient significance for the block ... a significance map”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nJ. M. Shapiro, “Embedded Image Coding Using Zerotrees of Wavelet Coefficients,” IEEE Transactions on Signal Processing, Vol. 41, No. 12, December 1993；US5412741A / US5412741（公開/公告均早於2009）揭露 zerotree map、significance map、以樹節點表示係數顯著性。\n\n### 時間比較：\n論文為 1993-12；US5412741A 公開日 1993-01-22，US5412741 授權日 1995-05-02；均早於 2009-07-02。\n\n### 說明：\n上述前案已揭露以樹狀／零樹方式表示係數顯著性，並輸出表示 significant / insignificant 的資訊；但其主要場景為 wavelet/zerotree，不是本案所述 HEVC 類 block-transform significance map 的同一實作脈絡，因此較穩健評為「可能已揭露」。\n\n## 特徵003: “the one or more tree structures, comprising one or more sub-trees, each having a plurality of nodes ... each sub-tree is a data structure used to convey a particular significance map for a set of scanned coefficients”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741；EP0883864A1（公開日 1998-12-16）揭露 tree structure、children nodes、significance bits、significant descendants，並以樹結構承載係數顯著性資訊。\n\n### 時間比較：\nUS5412741A 1993-01-22 / US5412741 1995-05-02；EP0883864A1 1998-12-16；均早於 priority date。\n\n### 說明：\n可支持「子樹／多節點結構承載顯著性資訊」之概念；但我尚未找到早於 priority date 且明確對應“for a set of scanned coefficients”此種 block scan + subtree mapping 的單一文獻，因此列為「可能已揭露」。\n\n## 特徵004: “the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n暫無法確認具體文獻來源，但從技術發展脈絡看可能屬既有技術。\n\n### 時間比較：\n不適用。\n\n### 說明：\n前述 zerotree / wavelet 文獻可支持「係數對應至樹節點」；但我目前未找到早於 2009-07-02 且明確寫出「linked to neighboring coefficients from two dimensions」的具體前案。\n\n## 特徵005: “some nodes of the tree structures are processed to encode non-zeros, while other nodes of the tree structures are processed to encode zeros”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741A / US5412741揭露 ZEROTREE ROOT、ISOLATED ZERO、POSITIVE SIGNIFICANT、NEGATIVE SIGNIFICANT 等符號，並區分零／非零及其後代之處理。\n\n### 時間比較：\n1993-01-22 / 1995-05-02，均早於 priority date。\n\n### 說明：\n該前案已具體顯示不同節點或節點狀態對應零與非零之處理；但其語境仍偏 wavelet zerotree，而非本案的 transform-block significance map。\n\n## 特徵006: “a flag indicates at least one significant coefficient in said block corresponding to the significance map”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nMarpe et al., IEEE TCSVT, July 2003，明確揭露 “coded_block_flag” 指示該 block 是否含有 significant/nonzero coefficients。\n\n### 時間比較：\n2003-07，早於 2009-07-02。\n\n### 說明：\n此特徵與 H.264/AVC CABAC 中的 coded_block_flag 高度對應。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001、特徵006\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  特徵002、特徵003、特徵005\n- 暫未找到對應揭露的特徵：\n  特徵004\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本 claim 將 H.264/AVC 既有之 significance map / coded_block_flag，與更早期 zerotree / tree-based significance coding 概念結合；高階構想不新，但“掃描係數集合 + 子樹 + 二維鄰近係數連結”的具體結構化落點，目前未找到 priority date 前的直接單一文獻，故新穎性不宜直接完全否定；然而顯而易見性已有相當挑戰空間。\n\n# claim 2\n## claim 2文字：\n2. In a video encoder, a method, comprising: encoding picture data for a block in a picture, wherein one or more tree structures are used to encode a binary set of data for indicating coefficient significance for the block, the one or more tree structures each, comprising one or more sub-trees, each having a plurality of nodes, wherein, a set of sub-trees is used to encode a particular part of a significance map, said significance map indicating coefficient significance for the block, wherein each sub-tree is a data structure used to convey a particular significance map for a set of scanned coefficients, the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions, and wherein some nodes of the tree structures are processed to encode non-zeros, while other nodes of the tree structures are processed to encode zeros, and a flag indicates at least one significant coefficient in said block corresponding to the significance map having a plurality of nodes, at least one of the nodes of the at least one of the one or more tree structures being modified responsive to one or more parameters.\n\n## 特徵001: “encoding picture data for a block in a picture”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nMarpe et al., IEEE TCSVT, July 2003.\n\n### 時間比較：\n2003-07，早於 priority date。\n\n### 說明：\n區塊式視訊殘差／係數編碼在 H.264/AVC 中已明確存在。\n\n## 特徵002: “one or more tree structures ... one or more sub-trees ... significance map ... set of scanned coefficients”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nShapiro 1993；US5412741；EP0883864A1。\n\n### 時間比較：\n1993、1995、1998，均早於 2009-07-02。\n\n### 說明：\n可支持樹狀結構、子節點、顯著性資訊與係數集合之對應概念，但未找到完全相同於本 claim 的 block-transform 掃描結構。\n\n## 特徵003: “some nodes ... encode non-zeros, while other nodes ... encode zeros, and a flag indicates at least one significant coefficient in said block”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741（零樹根／孤立零／正負顯著）；Marpe et al. 2003（coded_block_flag）。\n\n### 時間比較：\n1993/1995/2003，均早於 priority date。\n\n### 說明：\n零／非零節點區分與至少一顯著係數旗標，分別可由上述前案對應。\n\n## 特徵004: “at least one of the nodes of the at least one of the one or more tree structures being modified responsive to one or more parameters”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n暫未找到早於 2009-07-02 且直接揭露「樹節點依一或多個參數而被修改」的具體前案。\n\n### 時間比較：\n不適用。\n\n### 說明：\n這是 claim 2 相較其他獨立項較明顯的附加限制；目前未找到足夠直接的前案支持。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  特徵002、特徵003\n- 暫未找到對應揭露的特徵：\n  特徵004\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  claim 2 與 claim 1 的主體相同，但又加入「node modified responsive to parameters」限制；以目前材料看，此附加限制是較可能撐住差異性的部分。\n\n# claim 6\n## claim 6文字：\n6. An apparatus, comprising: a video decoder for decoding picture data for at least a block in a picture, wherein one or more tree structures are used to decode a binary set of data for indicating coefficient significance for the block, the one or more tree structures, comprising one or more sub-trees, each having a plurality of nodes, wherein, a set of sub-trees is used to decode a particular part of a significance map, said significance map indicating coefficient significance for the block, wherein each sub-tree is a data structure used to convey a particular significance map for a set of scanned coefficients, the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions, and wherein some nodes of the tree structures are processed to decode non-zeros, while other nodes of the tree structures are processed to decode zeros, and a flag indicates at least one significant coefficient in said block corresponding to the significance map.\n\n## 特徵001: “a video decoder for decoding picture data for at least a block in a picture”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nMarpe et al., IEEE TCSVT, July 2003。\n\n### 時間比較：\n2003-07，早於 priority date。\n\n### 說明：\n該文同時說明 CABAC 編碼與對應解碼程序。\n\n## 特徵002: “one or more tree structures are used to decode a binary set of data for indicating coefficient significance ... one or more sub-trees ... plurality of nodes”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741；EP0883864A1。\n\n### 時間比較：\n1993/1995/1998，均早於 2009-07-02。\n\n### 說明：\n上述前案均揭露在解碼端依樹結構輸入 significance bits／significant descendants 以重建係數顯著性。\n\n## 特徵003: “the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n暫無法確認具體文獻來源，但從技術發展脈絡看可能屬既有技術。\n\n### 時間比較：\n不適用。\n\n### 說明：\n仍缺乏 priority date 前的直接文獻，明示本特徵之二維鄰接連結描述。\n\n## 特徵004: “some nodes of the tree structures are processed to decode non-zeros, while other nodes of the tree structures are processed to decode zeros”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741；EP0883864A1。\n\n### 時間比較：\n早於 priority date。\n\n### 說明：\n前案已具體揭露對 significant / insignificant nodes 及 descendants 的解碼處理。\n\n## 特徵005: “a flag indicates at least one significant coefficient in said block corresponding to the significance map”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nMarpe et al. 2003 的 coded_block_flag。\n\n### 時間比較：\n2003-07，早於 priority date。\n\n### 說明：\n與 claim 1 同理。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001、特徵005\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  特徵002、特徵004\n- 暫未找到對應揭露的特徵：\n  特徵003\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  與 claim 1 基本平行，差異僅在解碼端；新穎性評價大致相同。\n\n# claim 7\n## claim 7文字：\n7. In a video decoder, a method, comprising: decoding picture data for a block in a picture, wherein one or more tree structures are used to decode a binary set of data for indicating coefficient significance for the block, the one or more tree structures, comprising one or more sub-trees, each having a plurality of nodes, wherein, a set of sub-trees is used to encode a particular part of a significance map, said significance map indicating coefficient significance for the block, wherein each sub-tree is a data structure used to convey a particular significance map for a set of scanned coefficients, the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions, and wherein some nodes of the tree structures are processed to encode non-zeros, while other nodes of the tree structures are processed to encode zeros, and a flag indicates at least one significant coefficient in said block corresponding to the significance map.\n\n## 特徵001: “decoding picture data for a block in a picture”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nMarpe et al., IEEE TCSVT, July 2003。\n\n### 時間比較：\n2003-07，早於 priority date。\n\n### 說明：\n區塊式殘差係數解碼本身為既有技術。\n\n## 特徵002: “one or more tree structures ... one or more sub-trees ... a particular significance map for a set of scanned coefficients”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741；EP0883864A1。\n\n### 時間比較：\n早於 priority date。\n\n### 說明：\n可支持樹狀結構處理 significance bits / descendants 的一般概念，但非完全相同之 block-transform 掃描語境。\n\n## 特徵003: “the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n暫無法確認具體文獻來源，但從技術發展脈絡看可能屬既有技術。\n\n### 時間比較：\n不適用。\n\n### 說明：\n同 claim 1 / claim 6。\n\n## 特徵004: “some nodes of the tree structures are processed to encode non-zeros, while other nodes of the tree structures are processed to encode zeros, and a flag indicates at least one significant coefficient in said block”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741；Marpe et al. 2003。\n\n### 時間比較：\n早於 priority date。\n\n### 說明：\n本 claim 雖寫成 decoder method，但後段仍出現 “encode non-zeros / encode zeros” 用語，可能是 claim drafting / text carry-over；就技術實質看，對應前案基礎仍與 claim 1/6 相同。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  特徵002、特徵004\n- 暫未找到對應揭露的特徵：\n  特徵003\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  與 claim 6 實質相同，若 claim wording 之 “encode” 為文字沿用，則前案評價不致有本質差異。\n\n# claim 11\n## claim 11文字：\n11. A non-transitory storage media having video signal data encoded thereupon, comprising: a binary set of data for indicating coefficient significance for a block in a picture, wherein the binary set of data is encoded using one or more tree structures, the one or more tree structures, comprising one or more sub-trees, each having a plurality of nodes, wherein, a set of sub-trees is used to encode a particular part of a significance map, said significance map indicating coefficient significance for the block, wherein each sub-tree is a data structure used to convey a particular significance map for a set of scanned coefficients, the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions, and wherein some nodes of the tree structures are processed to encode non-zeros, while other nodes of the tree structures are processed to encode zeros, and a flag indicates at least one significant coefficient in said block corresponding to the significance map.\n\n## 特徵001: “a binary set of data for indicating coefficient significance for a block in a picture”\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nMarpe et al., IEEE TCSVT, July 2003，明確揭露 binary-valued significance map、significant_coeff_flag、last_significant_coeff_flag。\n\n### 時間比較：\n2003-07，早於 priority date。\n\n### 說明：\n以二元資料表示區塊係數顯著性，在 H.264/AVC CABAC 中已是既有內容。\n\n## 特徵002: “the binary set of data is encoded using one or more tree structures ... one or more sub-trees, each having a plurality of nodes”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nShapiro 1993；US5412741；EP0883864A1。\n\n### 時間比較：\n早於 priority date。\n\n### 說明：\n樹結構承載顯著性資訊在前案已存在，但與本 claim 的 block-transform 掃描／子樹對應仍非完全一致。\n\n## 特徵003: “a set of sub-trees is used to encode a particular part of a significance map ... a particular significance map for a set of scanned coefficients”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741；EP0883864A1。\n\n### 時間比較：\n早於 priority date。\n\n### 說明：\n可支持以子樹／節點集合承載局部顯著性資訊之概念；但“for a set of scanned coefficients”之精準對應仍不足。\n\n## 特徵004: “the coefficient significance is mapped to nodes of the tree structures, linked to neighboring coefficients from two dimensions”\n\n### 判斷：\n暫未確認\n\n### 對應既有技術：\n暫無法確認具體文獻來源，但從技術發展脈絡看可能屬既有技術。\n\n### 時間比較：\n不適用。\n\n### 說明：\n同前。\n\n## 特徵005: “some nodes of the tree structures are processed to encode non-zeros, while other nodes of the tree structures are processed to encode zeros, and a flag indicates at least one significant coefficient in said block”\n\n### 判斷：\n可能已揭露\n\n### 對應既有技術：\nUS5412741（零／非零／顯著節點）；Marpe et al. 2003（coded_block_flag）。\n\n### 時間比較：\n早於 priority date。\n\n### 說明：\n該組特徵在前案中可分別對應，但未見一篇早於 priority date 的單一文獻完整對應本 claim 全部限制。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：\n  特徵001\n- 僅能合理推測但尚未找到具體文獻的特徵：\n  特徵002、特徵003、特徵005\n- 暫未找到對應揭露的特徵：\n  特徵004\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  claim 11 實質上反映前述編碼結果之媒體表述，其專利性評價大致跟隨 claim 1。\n\n# 總體結論\n- 已找到具體且早於 priority_date 的文獻支持：\n  1. H.264/AVC CABAC 已揭露 block-based significance map、significant_coeff_flag、last_significant_coeff_flag、coded_block_flag。\n  2. 更早的 zerotree / wavelet 文獻與專利已揭露以樹結構、節點、子節點、significance bits、zero / non-zero 節點狀態來編碼顯著性資訊。\n- 僅能合理推測但尚未找到具體文獻：\n  1. 將樹狀／子樹顯著性表達直接套用到 block transform coefficient 掃描集合；\n  2. 以子樹對應 significance map 局部區段；\n  3. 零／非零節點在本案 claim 語境下的具體實作。\n- 暫未找到對應揭露：\n  1. “linked to neighboring coefficients from two dimensions” 的明確、直接前案；\n  2. claim 2 中 “node ... modified responsive to one or more parameters” 的直接前案。\n- 整體新穎性 / 顯而易見性的初步判斷：\n  本案核心並非從零開始的全新構想；其多數上位概念可由 H.264/AVC 的 significance-map coding 與更早的 zerotree/tree-based significance coding 組合推得。惟以目前檢得資料，尚未找到在 priority date 前以單一文獻完整揭露本案所述「掃描係數集合 + 子樹 + 二維鄰近係數連結 + 零/非零節點分工」之具體結構。因此，較穩健的初步判斷是：整體顯而易見性風險偏高，但對個別細部限制，仍有進一步檢索空間。"}, {"pat_no": "US10034217", "ai_check": "# 發明概述  \n## 要解決的技術問題  \n本發明旨在解決WTRU在inter-RAT cell reselection時，針對不同優先權的candidate RAT cell如何有效決定品質測量時機，以避免不必要測量導致電力浪費，同時確保serving cell品質惡化時能及時發現更佳cell。  \n\n## 技術手段  \nWTRU自current cell接收priority information，該資訊指示inter-RAT cell相對於current cell的cell priority。  \n在第一條件（inter-RAT cell具higher priority）下決定進行品質測量；在第二條件（inter-RAT cell無higher priority，且current cell selection value ≤ predetermined threshold）下亦決定進行品質測量。  \n\n## 技術效果  \n透過優先權與serving cell品質的條件性測量機制，優化WTRU測量行為，降低功耗並提升cell reselection效率與移動性效能。  \n\n# claim 1  \n## claim 1文字：  \nA method for performing cell reselection implemented in a wireless transmit receive unit (WTRU), the method comprising: receiving priority information in a current cell associated with a current radio access technology (RAT), the priority information indicating a cell priority of an inter-RAT cell associated with a candidate RAT relative to the current cell associated with the current RAT; determining to perform quality measurements of the inter-RAT cell associated with the candidate RAT on a first condition that the inter-RAT cell associated with the candidate RAT has a higher priority than the current cell associated with the current RAT; and determining to perform quality measurements of the inter-RAT cell associated with the candidate RAT on a second condition that: the inter-RAT cell associated with the candidate RAT does not have a higher priority than the current cell associated with the current RAT, and a cell selection value of the current cell is less than or equal to a predetermined threshold.  \n\n## 特徵001: receiving priority information in a current cell associated with a current radio access technology (RAT), the priority information indicating a cell priority of an inter-RAT cell associated with a candidate RAT relative to the current cell associated with the current RAT  \n### 判斷：  \n暫無法確認具體文獻來源，但從技術發展脈絡看可能屬既有技術  \n\n### 對應既有技術：  \n3GPP TS 25.304 V7.0.0（Release 7）  \n\n### 時間比較：  \n2006-03，早於priority_date  \n\n### 說明：  \n規格描述current cell接收系統資訊以進行cell reselection，但未明確揭露inter-RAT cell的「cell priority」資訊；HCS PRIO雖提供層級優先，惟非本特徵所述之相對cell priority。  \n\n## 特徵002: determining to perform quality measurements of the inter-RAT cell associated with the candidate RAT on a first condition that the inter-RAT cell associated with the candidate RAT has a higher priority than the current cell associated with the current RAT  \n### 判斷：  \n暫無法確認具體文獻來源，但從技術發展脈絡看可能屬既有技術  \n\n### 對應既有技術：  \n無具體pre-2007文獻；LTE TS 36.304 V2.0.0（2007-10）始明確定義higher priority inter-RAT測量規則  \n\n### 時間比較：  \n2007-10，晚於priority_date  \n\n### 說明：  \nUMTS pre-2007以serving cell品質或HCS PRIO觸發測量，無本特徵所述之「higher priority」絕對條件。  \n\n## 特徵003: determining to perform quality measurements of the inter-RAT cell associated with the candidate RAT on a second condition that: the inter-RAT cell associated with the candidate RAT does not have a higher priority than the current cell associated with the current RAT, and a cell selection value of the current cell is less than or equal to a predetermined threshold  \n### 判斷：  \n暫無法確認具體文獻來源  \n\n### 對應既有技術：  \n無  \n\n### 時間比較：  \n無  \n\n### 說明：  \n本條件結合lower priority與serving cell selection value門檻，pre-2007 UMTS TS 25.304使用SsearchRAT等門檻但無priority相對判斷；LTE TS 36.304 V2.0.0（2007-10）有類似Sprioritysearch規則，但晚於priority_date。  \n\n## 小結：  \n- 已找到具體且早於priority_date的文獻支持的特徵：基本WTRU接收current cell資訊（TS 25.304 V7.0.0）  \n- 僅能合理推測但尚未找到具體文獻的特徵：higher priority測量條件  \n- 暫未找到對應揭露的特徵：lower priority結合serving cell selection value ≤ threshold之第二條件  \n- 對此claim之新穎性 / 顯而易見性的初步看法：核心條件性測量邏輯未見pre-2007具體揭露，具新穎性  \n\n# claim 11  \n## claim 11文字：  \nA wireless transmit receive unit (WTRU) comprising: a receiver; and a processor configured to: receive priority information in a current cell associated with a current radio access technology (RAT), the priority information indicating a cell priority of an inter-RAT cell associated with a candidate RAT and relative to the current cell associated with the current RAT; and determine to perform quality measurements of the inter-RAT cell associated with the candidate RAT on a first condition that the inter-RAT cell associated with the candidate RAT has a higher priority than the current cell associated with the current RAT; and determine to perform quality measurements of the inter-RAT cell associated with the candidate RAT based on a second condition that: the inter-RAT cell associated with the candidate RAT does not have a higher priority than the current cell associated with the current RAT, and a cell selection value of the current cell is less than or equal to a predetermined threshold.  \n\n## 特徵001: A wireless transmit receive unit (WTRU) comprising: a receiver; and a processor configured to  \n### 判斷：  \n已揭露  \n\n### 對應既有技術：  \n3GPP TS 25.304 V7.0.0（Release 7）  \n\n### 時間比較：  \n2006-03，早於priority_date  \n\n### 說明：  \n規格定義UE（即WTRU）具receiver與processor執行idle mode cell reselection程序。  \n\n## 特徵002: receive priority information in a current cell associated with a current radio access technology (RAT), the priority information indicating a cell priority of an inter-RAT cell associated with a candidate RAT and relative to the current cell associated with the current RAT  \n### 判斷：  \n暫無法確認具體文獻來源，但從技術發展脈絡看可能屬既有技術  \n\n### 對應既有技術：  \n3GPP TS 25.304 V7.0.0（Release 7）  \n\n### 時間比較：  \n2006-03，早於priority_date  \n\n### 說明：  \n基本接收current cell資訊存在
