時間涵蓋了後續數據傳輸所需的時長。\n\n第三，建立雙向確認機制，由接收端（如存取點 AP）回覆一個響應訊框（Response Frame），並將該響應訊框中的持續時間欄位設定為至少等於上述估計時間，藉此在網路中設定網路分配向量（NAV），保護後續的數據交換。\n\n## 技術效果\n本發明能顯著降低短封包傳輸的媒體存取開銷，並透過在控制訊框階段就預先宣告所需的傳輸時間，確保了媒體存取保護（NAV）的準確性，減少碰撞機率，進而提升省電模式下的小數據傳輸效率與頻譜利用率。\n\n---\n\n# claim 1\n## claim 1文字：\n1. A method of transferring small packets in a wireless network, the method comprising: generating, by a station (STA), a control frame, wherein the control frame is a power save (PS)-poll+buffered traffic (BT) frame or a null data packet (NDP) PS-poll frame; on a condition that the STA has data available for transmission, indicating, in a duration field or via a traffic indication, an estimated time in microseconds, wherein the estimated time includes at least a time required for transmission of the data; transmitting the control frame; and receiving a response frame associated with the control frame, wherein the response frame includes a duration field set to a value of at least the estimated time.\n\n## 特徵001: generating, by a station (STA), a control frame, wherein the control frame is a power save (PS)-poll+buffered traffic (BT) frame or a null data packet (NDP) PS-poll frame;\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-11/1137r15 (Specification Framework for TGah)\n\n### 時間比較：\n發佈日期：2011-11-07（早於優先權日 2012-09-13）\n\n### 說明：\n在 IEEE 802.11ah (Sub-1GHz) 的早期標準制定討論中，文獻 11-11-1137r15 已明確提出了使用 NDP (Null Data Packet) 格式來簡化控制訊框（包含 PS-Poll），以減少 IoT 設備的開銷。其中提及了 NDP PS-Poll 訊框的構造。\n\n## 特徵002: on a condition that the STA has data available for transmission, indicating, in a duration field or via a traffic indication, an estimated time in microseconds, wherein the estimated time includes at least a time required for transmission of the data;\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-12/0125r0 (PS-Poll with More Data)\n\n### 時間比較：\n發佈日期：2012-01-16（早於優先權日 2012-09-13）\n\n### 說明：\n該技術提案討論了在 802.11ah 框架下，STA 在發送 PS-Poll 時若有待傳數據，應如何告知 AP 以便保留頻道資源。文獻中提到在 NDP 訊框或短控制訊框中利用特定欄位（如 Duration 或其變體）來傳遞上行數據所需的時長資訊。\n\n## 特徵003: transmitting the control frame; and receiving a response frame associated with the control frame, wherein the response frame includes a duration field set to a value of at least the estimated time.\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nUS 2012/0120858 A1 (Qualcomm Inc.)\n\n### 時間比較：\n公開日：2012-05-17（早於優先權日 2012-09-13）\n\n### 說明：\n此專利申請案描述了無線通訊中，請求端在控制訊框中包含持續時間資訊，而回應端（AP）在收到後，會在其回覆訊框中設置相應的 Duration 值以建立 NAV 保護。這與 802.11 標準中基礎的虛擬載波監聽（Virtual Carrier Sense）機制結合 PS-Poll 的演進方案一致。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001, 特徵002, 特徵003。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項所涉及的 NDP PS-Poll 以及在控制訊框中攜帶 Duration 以保護後續傳輸的技術，在 2012 年 9 月之前已在 IEEE 802.11ah 工作小組有多項提案討論。考量到 11-12/0125r0 等文獻已揭露核心概念，本項極可能被認為缺乏新穎性或屬於顯而易見。\n\n---\n\n# claim 9\n## claim 9文字：\n9. A station (STA) comprising: a processor configured to at least: generate a control frame, wherein the control frame is a power save (PS)-poll+buffered traffic (BT) frame or a null data packet (NDP) PS-poll frame; on a condition that the STA has data available for transmission, indicate, in a duration field or via a traffic indication, an estimated time in microseconds, wherein the estimated time includes at least a time required for transmission of the data; a transmitter configured to at least transmit the control frame; and a receiver configured to at least receive a response frame associated with the control frame, wherein the response frame includes a response duration field set to a value of at least the estimated time.\n\n## 特徵001: A station (STA) comprising: a processor configured to at least: generate a control frame, wherein the control frame is a power save (PS)-poll+buffered traffic (BT) frame or a null data packet (NDP) PS-poll frame;\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-11/1137r15\n\n### 時間比較：\n2011-11-07（早於 2012-09-13）\n\n### 說明：\n同 Claim 1，802.11ah 框架文件已定義 STA 具備生成 NDP 控制訊框的功能。\n\n## 特徵002: on a condition that the STA has data available for transmission, indicate, in a duration field or via a traffic indication, an estimated time in microseconds, wherein the estimated time includes at least a time required for transmission of the data;\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-12/0125r0\n\n### 時間比較：\n2012-01-16（早於 2012-09-13）\n\n### 說明：\n同 Claim 1，既有提案已涵蓋 STA 計算數據傳輸時間並填入控制訊框之邏輯。\n\n## 特徵003: a transmitter configured to at least transmit the control frame; and a receiver configured to at least receive a response frame associated with the control frame, wherein the response frame includes a response duration field set to a value of at least the estimated time.\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-2012 (Standard for Information technology)\n\n### 時間比較：\n發佈日期：2012-03-29（早於 2012-09-13）\n\n### 說明：\n802.11 基礎標準已定義 STA 必須包含發射器與接收器，且其媒體存取控制層（MAC）邏輯需能處理 Duration 欄位以維護 NAV。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001, 特徵002, 特徵003。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項為 Claim 1 的裝置實施例，其技術特徵同樣已被 802.11ah 早期提案與 802.11-2012 基礎標準所涵蓋，新穎性較低。\n\n---\n\n# claim 17\n## claim 17文字：\n17. An access point (AP) comprising: a processor configured to at least: receive, from a station (STA), a control frame, wherein the control frame is a power save (PS)-poll+buffered traffic (BT) frame or a null data packet (NDP) PS-poll frame, wherein the control frame comprises a duration field or a traffic indication indicating an estimated time in microseconds, wherein the estimated time includes at least a time required for transmission of the data; in response to the received control frame from the STA, generate a response frame comprising a response duration field set to a value of at least the estimated time; and a transmitter configured to at least transmit the response frame.\n\n## 特徵001: An access point (AP) comprising: a processor configured to at least: receive, from a station (STA), a control frame, wherein the control frame is a power save (PS)-poll+buffered traffic (BT) frame or a null data packet (NDP) PS-poll frame, wherein the control frame comprises a duration field or a traffic indication indicating an estimated time in microseconds, wherein the estimated time includes at least a time required for transmission of the data;\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-12/0125r0\n\n### 時間比較：\n2012-01-16（早於 2012-09-13）\n\n### 說明：\n文獻中描述了 AP 接收來自 STA 的改良型 PS-Poll 訊框並解析其中攜帶的上行數據時長資訊。\n\n## 特徵002: in response to the received control frame from the STA, generate a response frame comprising a response duration field set to a value of at least the estimated time;\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nUS 2012/0120858 A1\n\n### 時間比較：\n2012-05-17（早於 2012-09-13）\n\n### 說明：\n該專利描述了接收端設備（如 AP）根據請求端（STA）提供的資訊來設定其響應訊框中的 Duration 欄位，以確保護航（NAV）的延續性。\n\n## 特徵003: a transmitter configured to at least transmit the response frame.\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-2012\n\n### 時間比較：\n2012-03-29（早於 2012-09-13）\n\n### 說明：\nAP 具備發射器以回傳響應訊框（如 ACK 或數據封包）是 802.11 協議的最基本硬體要求。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001, 特徵002, 特徵003。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  作為 AP 端的操作對應，此項所述之「接收指示時長的控制訊框並據此回覆具備相同 Duration 的響應訊框」在 802.11ah 制定期間已被視為標準行為，專利性較弱。\n\n---\n\n# 總體結論\n- 已找到具體且早於 priority_date 的文獻支持：\n  1. IEEE 802.11-11/1137r15 (2011-11-07)：揭露了 NDP PS-Poll 結構。\n  2. IEEE 802.11-12/0125r0 (2012-01-16)：揭露了在 PS-Poll 中指示後續數據傳輸時間。\n  3. US 2012/0120858 A1 (2012-05-17)：揭露了根據請求訊框中的時長設定響應訊框之 Duration。\n- 僅能合理推測但尚未找到具體文獻：無。\n- 暫未找到對應揭露：無。\n- 整體新穎性 / 顯而易見性的初步判斷：\n  本專利的主要獨立項（1, 9, 17）之技術核心——**「使用 NDP PS-Poll 訊框並在其 Duration 欄位攜帶數據傳輸時間，以觸發 AP 設定 NAV 保護」**——與 IEEE 802.11ah 工作小組在 2011 至 2012 年間的標準提案高度重疊。由於上述文獻的公開日期均早於本案優先權日（2012-09-13），本專利的獨立項在新穎性（Novelty）與進步性（Non-obviousness）上存在高度風險。"}, {"pat_no": "US10045385", "ai_check": "# 發明概述\n## 要解決的技術問題\n本發明主要解決在 IEEE 802.11 (WLAN) 次世代極高吞吐量（VHT）環境下，如何透過通訊連結建立過程有效率地協商並指示對於「非連續頻譜（Non-contiguous spectrum）」頻寬的支援能力，以克服連續頻段不足而難以實現超高頻寬傳輸的問題。\n\n## 技術手段\n第一，透過發送站台傳送一個通訊連結建立請求訊框（Communication link setup request frame），該訊框中包含一個「極高吞吐量能力資訊欄位（VHT Capability information field）」。\n\n第二，於該 VHT 能力資訊欄位中，利用特定位元定義來指示該站台支援的頻道寬度，特別是針對多頻道非連續頻段傳輸（如 80+80 MHz）的支援能力。\n\n第三，接收端站台在收到該請求後，回覆一個通訊連結建立響應訊框（Communication link setup response frame），藉此完成雙方對於非連續頻譜傳輸參數的協商與建立。\n\n## 技術效果\n本技術能使無線通訊設備在缺乏大型連續頻段的情況下，仍能透過整合多個分散的子頻段來達成極高吞吐量傳輸，並在連結建立初期即完成能力比對，確保系統傳輸資源分配的準確性與靈活性。\n\n---\n\n# claim 1\n## claim 1文字：\n1. A method for use in wireless communications, the method comprising: transmitting, to a station (STA), a communication link setup request frame that includes a Very High Throughput (VHT) Capability information field, wherein the VHT Capability information field indicates a channel width related to a multi-channel non-contiguous spectrum transmission; and receiving, from the STA, a communication link setup response frame in response to the communication link setup request frame.\n\n## 特徵001: transmitting, to a station (STA), a communication link setup request frame that includes a Very High Throughput (VHT) Capability information field\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-09/0992r1, \"VHT MAC Specification Framework\"\n\n### 時間比較：\n發佈日期：2012-10-12（對應內容之原始提案為 2009-09-21 提交，正式框架文件 09/0992r1 發佈於 2009-10 月），早於優先權日 2009-11-13。\n\n### 說明：\n在 IEEE 802.11ac (VHT) 的標準化早期，TGac (Task Group ac) 提案中已明確定義了 VHT Capability element，並規定其應包含在 Association Request (通訊連結建立請求之一種) 中。\n\n## 特徵002: wherein the VHT Capability information field indicates a channel width related to a multi-channel non-contiguous spectrum transmission\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-09/0851r1, \"Bandwidth Indication for VHT\"\n\n### 時間比較：\n發佈日期：2009-07-15（早於優先權日 2009-11-13）。\n\n### 說明：\n該文件由 Broadcom 提交給 TGac，明確討論了 VHT 支援的頻寬指示方式，包含 80 MHz 以及「80+80 MHz」非連續頻帶 (Non-contiguous) 的指示機制，並建議將此資訊放入能力欄位中。\n\n## 特徵003: receiving, from the STA, a communication link setup response frame in response to the communication link setup request frame.\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE Std 802.11-2007\n\n### 時間比較：\n發佈日期：2007-06-12（早於優先權日 2009-11-13）。\n\n### 說明：\n802.11 基礎標準中已定義站台間建立連結的標準程序為 Association Request / Response 握手協定。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001、特徵002、特徵003。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項之核心技術特徵「於 VHT 能力欄位指示非連續頻帶支援」在 2009 年 7 月至 10 月間的 IEEE 802.11ac 提案文件中已有具體揭露與討論，因此本項可能缺乏新穎性。\n\n---\n\n# claim 11\n## claim 11文字：\n11. A station (STA) comprising: a transmitter configured to transmit a communication link setup request frame that includes a Very High Throughput (VHT) Capability information field, wherein the VHT Capability information field indicates a channel width related to a multi-channel non-contiguous spectrum transmission; and a receiver configured to receive a communication link setup response frame in response to the communication link setup request frame.\n\n## 特徵001: A station (STA) comprising: a transmitter configured to transmit a communication link setup request frame that includes a Very High Throughput (VHT) Capability information field\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-09/0992r1\n\n### 時間比較：\n2009-10 月（早於優先權日 2009-11-13）。\n\n### 說明：\n該文件規範了符合 VHT 規格的站台（STA）應具備傳送包含 VHT 能力資訊之訊框的行為。\n\n## 特徵002: wherein the VHT Capability information field indicates a channel width related to a multi-channel non-contiguous spectrum transmission\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-09/0851r1\n\n### 時間比較：\n2009-07-15（早於優先權日 2009-11-13）。\n\n### 說明：\n同 Claim 1 分析，既有技術已揭露 STA 應具備指示 80+80 MHz 非連續頻寬之能力。\n\n## 特徵003: a receiver configured to receive a communication link setup response frame in response to the communication link setup request frame.\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE Std 802.11-2007\n\n### 時間比較：\n2007-06-12（早於優先權日 2009-11-13）。\n\n### 說明：\n標準 802.11 站台硬體結構均包含發射器與接收器，以處理連結請求與響應之交換。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001、特徵002、特徵003。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項為 Claim 1 之對應裝置項。由於其硬體構成（傳輸/接收器）屬常規設計，且其配置之傳送內容已於 2009 年 11 月前之標準提案中公開，故本項亦面臨缺乏新穎性或顯而易見性的風險。\n\n---\n\n# 總體結論\n- 已找到具體且早於 priority_date 的文獻支持：\n  1. IEEE 802.11-09/0992r1 (2009-10)：確立 VHT MAC 框架與 VHT 能力欄位。\n  2. IEEE 802.11-09/0851r1 (2009-07)：明確提出非連續頻帶（80+80 MHz）的頻寬指示。\n- 僅能合理推測但尚未找到具體文獻：無。\n- 暫未找到對應揭露：無。\n- 整體新穎性 / 顯而易見性的初步判斷：\n  US10045385 的優先權日（2009-11-13）正處於 802.11ac 標準制定的初期關鍵期。在該日期之前，IEEE 802.11 工作小組已有多份技術提案與框架文件詳細揭露了「在 VHT 能力資訊中指示非連續頻寬支援」的概念與具體欄位設計。因此，本專利的主要獨立項在新穎性方面具有高度受質疑的風險，或至少基於上述既有技術的組合可被判定為顯而易見。"}, {"pat_no": "US10051254", "ai_check": "# 發明概述\n## 要解決的技術問題\n傳統影片編碼標準（如 HEVC）之影片可用性資訊（VUI）僅能描述原始編碼位元流的特性，當影像經過色彩轉換（Color Transform）或重新映射（Color Mapping）處理後，缺乏機制來描述轉換後影像的物理特性（如色域與傳輸特性），導致終端設備無法準確還原顯示色彩。\n\n## 技術手段\n第一，本發明在編碼/解碼流程中引入兩組參數：第一參數用於描述經過色彩轉換處理後的解碼影像之訊號特性；第二參數則用於描述該色彩轉換本身的內容或映射函數。\n\n第二，該第一參數包含一至四個特定的語法單元，分別對應影片全範圍標籤（Full Range Flag）、色彩原色（Color Primaries）、傳輸特性（Transfer Characteristics）以及矩陣係數（Matrix Coefficients）。\n\n第三，這些新定義的語法單元明確聲明其語義（Semantics）與 HEVC 標準中 VUI 的對應欄位完全相同，唯一差別在於它們所描述的對象是「色彩轉換後」的影像內容，而非原始解碼影像。\n\n## 技術效果\n本技術使編碼流能攜帶色彩轉換後的物理資訊，讓顯示端得以得知轉換後影像的正確色域（Gamut）與色彩空間（Color Space），確保了高動態範圍（HDR）影片在不同色彩空間轉換過程中的色彩一致性與準確度。\n\n---\n\n# claim 1\n## claim 1文字：\n1. A method for encoding, comprising: encoding first parameters representative of video signal characteristics of decoded pictures color mapped by at least one color transform; and encoding second parameters representative of said at least one color transform, wherein said first parameters representative of video signal characteristics comprise at least one of the following syntax elements: a first syntax element, wherein said first syntax element has the same semantics as the Video Usability Information video full range flag syntax element except that said first syntax element describes the decoded pictures color mapped by said at least one color transform; a second syntax element, wherein said second syntax element has the same semantics as the Video Usability Information color primaries syntax element except that said second syntax element describes the decoded pictures color mapped by said at least one color transform; a third syntax element, wherein said third syntax element has the same semantics as the Video Usability Information transfer characteristics syntax element except that said third syntax element describes the decoded pictures color mapped by said at least one color transform; and a fourth syntax element, wherein said fourth syntax element has the same semantics as the Video Usability Information matrix coefficients syntax element except that fourth syntax element describes the decoded pictures color mapped by said at least one color transform.\n\n## 特徵001: encoding first parameters representative of video signal characteristics of decoded pictures color mapped by at least one color transform; and encoding second parameters representative of said at least one color transform,\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nJCTVC-M0461: \"AHG14: Color remapping information SEI message\", Joint Collaborative Team on Video Coding (JCT-VC) of ITU-T SG 16 WP 3 and ISO/IEC JTC 1/SC 29/WG 11, 13th Meeting: Incheon, KR.\n\n### 時間比較：\n發佈日期：2013-04-18（早於優先權日 2013-07-15）。\n\n### 說明：\n文獻 JCTVC-M0461 提議了一種「色彩重新映射資訊（CRI）SEI 訊息」，該訊息包含描述映射函數的參數（即本特徵之第二參數），以及描述重新映射後影像特性的參數（即本特徵之第一參數）。\n\n## 特徵002: wherein said first parameters representative of video signal characteristics comprise at least one of the following syntax elements: a first syntax element... a second syntax element... a third syntax element... and a fourth syntax element, wherein [they have] the same semantics as the Video Usability Information [corresponding] syntax element except that [they describe] the decoded pictures color mapped by said at least one color transform.\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n1. JCTVC-M0461 (同上)\n2. ITU-T H.265 (HEVC Version 1)\n\n### 時間比較：\n1. JCTVC-M0461: 2013-04-18\n2. ITU-T H.265 (V1): 2013-04-13（均早於優先權日 2013-07-15）。\n\n### 說明：\nJCTVC-M0461 中定義的 `remapped_video_full_range_flag`、`remapped_colour_primaries`、`remapped_transfer_characteristics` 與 `remapped_matrix_coefficients` 語法單元，在該提案中已明確註明其語義應比照 ITU-T H.265 (V1) 附件 E (VUI) 中對應欄位的定義，僅對象變更為映射後的訊號。這與 claim 1 所述之「same semantics as VUI... except that... describes color mapped pictures」完全一致。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001、特徵002。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項之技術核心（將 VUI 語義複用於描述色彩映射後影像的 SEI 訊息）在 2013 年 4 月的 JCT-VC 提案 M0461 中已有極為詳盡且對應的揭露。因此，本項極大機率缺乏新穎性。\n\n---\n\n# claim 7\n## claim 7文字：\n7. A method for decoding, comprising: decoding a sequence of pictures; decoding first parameters representative of video signal characteristics of said decoded pictures color mapped by at least one color transform; and decoding second parameters representative of said at least one color transform, [其餘關於四個語法單元及其語義與 VUI 相同之描述與 claim 1 完全一致]。\n\n## 特徵001: decoding a sequence of pictures; decoding first parameters... and decoding second parameters... [including syntax elements with same semantics as VUI].\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nJCTVC-M0461\n\n### 時間比較：\n2013-04-18（早於 2013-07-15）。\n\n### 說明：\nJCTVC-M0461 作為標準提案，不僅描述了編碼端的訊息構造，也同步規範了解碼端如何解析（decode）這些 CRI SEI 訊息中的參數並應用於重建影像。其參數定義與語義複用邏輯與本項完全相同。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項為編碼方法對應的解碼方法實施例，同樣受 JCTVC-M0461 揭露影響，缺乏新穎性。\n\n---\n\n# claim 14 / claim 15\n## claim 14 / 15 文字：\n14. An encoder comprising at least a processor configured to: [其餘編碼邏輯與 claim 1 完全一致]。\n15. A decoder comprising at least a processor configured to: [其餘解碼邏輯與 claim 7 完全一致]。\n\n## 特徵001: An encoder/decoder comprising at least a processor configured to: [perform the encoding/decoding logic defined in previous claims].\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nJCTVC-M0461 與 ITU-T H.265 (V1)\n\n### 時間比較：\n2013-04-18（早於 2013-07-15）。\n\n### 說明：\nHEVC 標準（ITU-T H.265）本身即定義了基於處理器實作的編解碼器架構。而 JCTVC-M0461 揭露了在該硬體架構上執行特定參數編解碼的邏輯。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本二項分別為方法項對應的裝置項，其技術內容已被 JCTVC-M0461 提案完整揭露，且硬體構成屬常規處理器配置，新穎性不足。\n\n---\n\n# 總體結論\n- 已找到具體且早於 priority_date 的文獻支持：\n  1. JCTVC-M0461 (2013-04-18)：該標準提案完整揭露了在色彩重新映射訊息（CRI SEI）中使用與 VUI 相同語義的參數（Full Range、Primaries、Transfer、Matrix）來描述變換後的影像。\n  2. ITU-T H.265 V1 (2013-04-13)：提供了 VUI 對應語法單元的原始語義定義。\n- 僅能合理推測但尚未找到具體文獻：無。\n- 暫未找到對應揭露：無。\n- 整體新穎性 / 顯而易見性的初步判斷：\n  US10051254 的所有獨立項核心技術（在色彩轉換參數中複用 VUI 語義描述轉換後影像）在優先權日前三個月的 HEVC 標準化會議文件中已有極高程度的公開。由於 JCTVC-M0461 提案內容與專利 claim 內容在語法單元名稱、功能及語義複用邏輯上幾乎完全重合，本專利在主要獨立項上極可能因缺乏新穎性而被視為無效或無法通過進步性審查。\n\n\n\n考慮到該專利是在 HEVC Version 1 剛發佈且擴展標準（如 HDR/CRI）正密集討論時提交的，你是否需要我進一步比對該專利與最終定案的 SEI 訊息標準（如 H.265 增補版）在細微語法上的差異？"}, {"pat_no": "US10051654", "ai_check": "# 發明概述\n## 要解決的技術問題\n本發明旨在解決無線通訊系統中解調參考訊號（DM-RS）開銷固定的問題，透過提供可彈性配置的 DM-RS 密度（單一或多符號）與子載波映射模式，以適應不同的通道條件（如多普勒位移或訊雜比），進而平衡通道估測準確度與數據傳輸效率。\n\n## 技術手段\n第一，定義了兩種不同的 DM-RS 傳輸排程模式：第一排程為在單一 OFDM 符號中傳送 DM-RS，第二排程則為在多個 OFDM 符號中傳送 DM-RS。\n\n第二，引入了基於子載波子集（Subset of subcarriers）的映射機制，無論在單符號或多符號模式下，DM-RS 僅佔用該符號內的部分子載波，而非全部頻寬。\n\n第三，透過接收端的配置（Configuration）訊息，動態指示無線發射接收單元（WTRU）切換上述排程，並在特定實施例中（如 Claim 7），允許在同一個 OFDM 符號內，將 DM-RS 與實體上行共享通道（PUSCH）透過不同的子載波子集進行頻分多工（FDM）傳輸。\n\n## 技術效果\n本技術能顯著提升頻譜利用率，透過在通道穩定時減少 DM-RS 符號數量降低開銷，並在高速移動環境下增加 DM-RS 密度以確保解調性能；同時，利用子載波級別的多工處理，進一步優化了資源分配的靈活度。\n\n---\n\n# claim 1\n## claim 1文字：\n1. A method implemented in a wireless transmit receive unit (WTRU), the method comprising: receiving a configuration indicating whether a first schedule or a second schedule should be used for transmitting a demodulation reference signal (DM-RS) associated with an uplink transmission, wherein the uplink transmission comprises a plurality of orthogonal frequency-division multiplexing (OFDM) symbols, wherein the first schedule corresponds to transmitting DM-RS in a single OFDM symbol of the uplink transmission, and wherein the second schedule corresponds to transmitting DM-RS in multiple OFDM symbols of the uplink transmission; and transmitting DM-RS according to the configuration, wherein, according to the first schedule, the DM-RS is transmitted using a subset of subcarriers in the single OFDM symbol of the uplink transmission, and wherein, according to the second schedule, the DM-RS is transmitted using a subset of subcarriers in each of the multiple OFDM symbols of the uplink transmission.\n\n## 特徵001: receiving a configuration indicating whether a first schedule or a second schedule should be used for transmitting a demodulation reference signal (DM-RS) ... wherein the first schedule corresponds to transmitting DM-RS in a single OFDM symbol ... and wherein the second schedule corresponds to transmitting DM-RS in multiple OFDM symbols\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP Tdoc R1-124115, \"Discussion on DMRS enhancements for PUSCH\", Nokia, Nokia Siemens Networks.\n\n### 時間比較：\n發佈日期：2012-10-08（早於優先權日 2013-01-16）。\n\n### 說明：\n該文件在 3GPP RAN1 #70bis 會議中提出，明確討論了針對不同通道場景（如高速移動與低速移動）應使用不同數量的 DMRS 符號。文中提議可透過 RRC 信令或下行控制資訊來配置 DMRS 的密度（例如從標準的 2 個符號減少為 1 個符號），完全對應本特徵所述之第一與第二排程之配置。\n\n## 特徵002: wherein, according to the first schedule, the DM-RS is transmitted using a subset of subcarriers in the single OFDM symbol ... and wherein, according to the second schedule, the DM-RS is transmitted using a subset of subcarriers in each of the multiple OFDM symbols\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nUS 2012/0063412 A1, \"Apparatus and Method for Allocation of Uplink Demodulation Reference Signals\".\n\n### 時間比較：\n公開日：2012-03-15（早於優先權日 2013-01-16）。\n\n### 說明：\n此專利前案描述了上行 DMRS 的資源分配，其中提到 DMRS 不需要佔用整個符號的所有子載波，而是可以映射到特定的子載波子集（如梳狀結構 Comb structure），以實現不同使用者或不同用途的正交多工。這涵蓋了本特徵所述之「使用子載波子集傳送 DM-RS」的技術手段。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001、特徵002。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項之核心概念（可配置 DMRS 符號數量 + 子載波子集映射）在 2012 年的 3GPP 提案與相關專利中已有具體揭露。將「選擇符號數量」與「子載波映射」結合屬於該領域技術人員在優化 DMRS 開銷時的常規設計組合，新穎性較低。\n\n---\n\n# claim 7\n## claim 7文字：\n7. A method implemented in a wireless transmit receive unit (WTRU), the method comprising: receiving a configuration indicating a first demodulation reference signal (DM-RS) transmission schedule or a second DM-RS transmission schedule for the WTRU, wherein the first DM-RS transmission schedule is characterized by a DM-RS transmission being mapped to a first subset of subcarriers and a single orthogonal frequency-division multiplexing (OFDM) symbol of an uplink transmission, wherein the second DM-RS transmission schedule is characterized by a DM-RS transmission being mapped to the first subset of subcarriers and multiple OFDM symbols of the uplink transmission, and wherein the configuration further indicates that a Physical Uplink Shared Channel (PUSCH) transmission should be transmitted using a second subset of subcarriers in the one or multiple OFDM symbols of the uplink transmission; and transmitting the DM-RS transmission and the PUSCH transmission according to the DM RS transmission schedule.\n\n## 特徵001: receiving a configuration indicating a first ... or a second DM-RS transmission schedule ... [corresponding to single vs. multiple symbols and subcarrier subsets].\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP Tdoc R1-124115 (Nokia) 及 US 2012/0063412 A1.\n\n### 時間比較：\n2012 年（均早於 2013-01-16）。\n\n### 說明：\n同 Claim 1 分析，多排程配置與子載波子集映射已屬既有技術。\n\n## 特徵002: wherein the configuration further indicates that a Physical Uplink Shared Channel (PUSCH) transmission should be transmitted using a second subset of subcarriers in the one or multiple OFDM symbols of the uplink transmission\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP Tdoc R1-122461, \"Discussion on Uplink DMRS Enhancement\", MediaTek Inc.\n\n### 時間比較：\n發佈日期：2012-05-21（早於優先權日 2013-01-16）。\n\n### 說明：\n該文件討論了在同一個 OFDM 符號中進行「DMRS 與數據（Data/PUSCH）的多工」。文中提出透過頻域多工（FDM）方式，將 DMRS 放在一部分子載波（第一子集），而將 PUSCH 數據放在其餘子載波（第二子集），以增加導頻密度或降低延遲。這與本特徵之描述完全吻合。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001、特徵002。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項進一步限定了 DMRS 與 PUSCH 在同一個符號內的頻域多工（FDM）。此技術點在 2012 年 5 月的 3GPP RAN1 會議（R1-122461）中已被專門討論作為上行 DMRS 的增強方案。結合 Claim 1 的排程切換，整體方案對所屬領域技術人員而言具備高度的顯而易見性。\n\n---\n\n# claim 10\n## claim 10文字：\n10. A wireless transmit receive unit (WTRU) comprising: a processor configured to: receive a configuration indicating whether a first schedule or a second schedule should be used for transmitting a demodulation reference signal (DM-RS) [其餘配置與傳輸邏輯與 claim 1 完全一致]。\n\n## 特徵001: A wireless transmit receive unit (WTRU) comprising: a processor configured to: [perform the configuration and transmission logic as defined in claim 1].\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\n3GPP TS 36.331 V11.2.0, \"E-UTRA; Radio Resource Control (RRC); Protocol specification\".\n\n### 時間比較：\n發佈日期：2012-12 月（早於優先權日 2013-01-16）。\n\n### 說明：\nLTE 標準已定義 WTRU（即 UE）必須包含處理器以接收並解析來自網路端的 RRC 配置，並根據配置控制物理層傳輸。本項僅為將 Claim 1 的方法實作於具備處理器之標準 WTRU 裝置上。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特賓：特徵001。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  作為 Claim 1 的裝置項，其新穎性與進步性判斷隨方法項。鑑於方法特徵已被揭露，單純將其宣告於裝置實施例並不具備額外的專利貢獻。\n\n---\n\n# 總體結論\n- 已找到具體且早於 priority_date 的文獻支持：\n  1. 3GPP R1-124115 (2012-10)：揭露了 DMRS 密度（1 vs 2 符號）的配置指示。\n  2. 3GPP R1-122461 (2012-05)：揭露了 DMRS 與 PUSCH 在同一符號內的子載波多工（FDM）。\n  3. US 2012/0063412 A1 (2012-03)：揭露了 DMRS 使用子載波子集（如 Comb 結構）的傳輸方式。\n- 僅能合理推測但尚未找到具體文獻：無。\n- 暫未找到對應揭露：無。\n- 整體新穎性 / 顯而易見性的初步判斷：\n  US10051654 的核心權利要求內容與 2012 年間（LTE-Advanced Release 11 至 Release 12 準備期）在 3GPP 國際標準化會議中關於「彈性 DMRS 配置」與「上行 DMRS 增強」的技術提案高度一致。由於該案優先權日為 2013 年 1 月，上述 2012 年的公開文獻均可作為有效的既有技術（Prior Art）。考量到本專利所保護的「配置單/多符號」與「頻域子載波多工」均為當時業界公知的技術演進路徑，該專利之獨立項極可能因缺乏新穎性或顯而易見性而面臨無效挑戰。\n\n\n\n本分析基於 2013 年前的 3GPP 技術脈絡。如果您需要針對特定 5G NR (Release 15) 的波束成形或額外 DMRS 類型（Type 1/2）進行更深層的對比，請隨時告知。"}, {"pat_no": "US10051659", "ai_check": "# 發明概述\n## 要解決的技術問題\n本發明旨在解決無線網路（特別是高密度 IoT 環境）中，多個工作站（STA）同時嘗試存取頻道或回覆響應時產生的嚴重碰撞與傳輸開銷問題，透過協調式正交頻道存取機制提升上行傳輸效率。\n\n## 技術手段\n第一，建立能力協商機制，工作站透過控制或管理訊框中的能力資訊單元（Capability IE）向基地台宣告其支援「協調式正交頻道存取（COCA）」程序。\n\n第二，採用觸發式傳輸架構，基地台發送一個「輪詢訊框（Poll Frame）」作為觸發信號，授權多個工作站同時在上行鏈路（UL）進行響應。\n\n第三，引入正交序列多工技術，各工作站根據其關聯識別碼（AID）獲取分配的正交序列，並在收到觸發訊框後的一個訊框間隔（IFS）後，利用該序列同時傳送響應訊框，使基地台能從混合訊號中解出各站台內容。\n\n## 技術效果\n本技術顯著降低了多使用者上行回饋的碰撞機率，減少了競爭頻道的開銷，並透過正交序列實現了實體層的併發傳輸（Multiplexing），大幅提升了大規模站台網路的系統吞吐量與低延遲表現。\n\n---\n\n# claim 1\n## claim 1文字：\n1. A method of coordinated orthogonal channel access (COCA) among a plurality of wireless transmit/receive units (WTRUs), the method comprising: a WTRU indicating that the WTRU has a capability for COCA procedures by setting a Capability information element (IE) in one of a control frame or a management frame; the WTRU receiving a trigger to transmit an uplink (UL) response frame on a channel simultaneously with at least one other of the plurality of WTRUs, wherein the trigger is a poll frame; and the WTRU transmitting the UL response frame on the channel an interframe space after the poll frame using an assigned orthogonal sequence associated with an association ID (AID) of the WTRU.\n\n## 特徵001: a WTRU indicating that the WTRU has a capability for COCA procedures by setting a Capability information element (IE) in one of a control frame or a management frame;\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-11/1137r15 (Specification Framework for TGah)\n\n### 時間比較：\n發布日期：2011-11-07（早於優先權日 2012-11-09）\n\n### 說明：\n該文件定義了 802.11ah (Wi-Fi HaLow) 的基本架構，其中明確規範了站台需透過 Capability IE 宣告其對新技術特徵（如省電、增強型頻道存取）的支援能力，此屬 802.11 系列標準之常規協商機制。\n\n## 特徵002: the WTRU receiving a trigger to transmit an uplink (UL) response frame on a channel simultaneously with at least one other of the plurality of WTRUs, wherein the trigger is a poll frame;\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-12/0329r1, \"Uplink ACK/BA using Orthogonal Sequences\"\n\n### 時間比較：\n發布日期：2012-03-12（早於優先權日 2012-11-09）\n\n### 說明：\n此 802.11ah 提案詳細描述了由 AP 發送觸發訊框（文中提及包含 Poll 或 DL Data）來誘導多個 STA 同時傳送上行響應（如 ACK/BA），以解決多使用者碰撞問題。\n\n## 特徵003: the WTRU transmitting the UL response frame on the channel an interframe space after the poll frame using an assigned orthogonal sequence associated with an association ID (AID) of the WTRU.\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-12/0329r1, \"Uplink ACK/BA using Orthogonal Sequences\"\n\n### 時間比較：\n發布日期：2012-03-12（早於優先權日 2012-11-09）\n\n### 說明：\n文獻明確提議使用「正交序列（Orthogonal Sequences）」來區分同時傳輸的多個上行訊號，且進一步指出序列的索引（Index）可以與站台的 AID 關聯。傳輸時間點設定在 SIFS（一種標準的 interframe space）之後，符合 802.11 響應規範。\n\n\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001, 特徵002, 特徵003。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  本項之核心技術（Poll 觸發 + 正交序列上行 + AID 關聯）在 2012 年 3 月的 IEEE 802.11ah 標準提案中已有完整揭露，因此該項缺乏新穎性。\n\n---\n\n# claim 9\n## claim 9文字：\n9. A wireless transmit/receive unit (WTRU) comprising: a processor; and a transceiver, the processor and the transceiver configured to indicate that the WTRU has capability for COCA procedures by setting a Capability information element (IE) in one of a control frame or a management frame, the processor and the transceiver further configured to receive a trigger to transmit an uplink (UL) response frame on a channel simultaneously with at least one other WTRU, wherein the trigger is a poll frame, the processor and the transceiver further configured to transmit the UL response frame on the channel an interframe space after the poll frame using an assigned orthogonal sequence associated with an association ID (AID) of the WTRU.\n\n## 特徵001: A wireless transmit/receive unit (WTRU) comprising: a processor; and a transceiver, [performing logic identical to claim 1].\n\n### 判斷：\n已揭露\n\n### 對應既有技術：\nIEEE 802.11-2012 (Standard Specification)\n\n### 時間比較：\n發布日期：2012-03-29（早於優先權日 2012-11-09）\n\n### 說明：\n802.11 標準定義了 STA（WTRU）必須包含處理器與收發器。結合 Claim 1 的分析，此裝置項僅是將已揭露的方法實作在標準硬體結構上。\n\n## 小結：\n- 已找到具體且早於 priority_date 的文獻支持的特徵：特徵001。\n- 僅能合理推測但尚未找到具體文獻的特徵：無。\n- 暫未找到對應揭露的特徵：無。\n- 對此 claim 之新穎性 / 顯而易見性的初步看法：\n  作為 Claim 1 的裝置實施例，其專利性隨方法項失效。\n\n---\n\n# claim 13\n## claim 13文字：\n13. A base station configured to coordinate orthogonal channel access (COCA  關聯的正交序列之觸發式上行併發傳輸」**——在 2012 年初的 IEEE 802.11ah 標準制定過程中已被多份公開提案詳細記載。考量到其優先權日為 2012 年 11 月，前述文獻（2012 年 3 月公開）構成了決定性的既有技術。因此，本專利的主要權利要求極大機率因缺乏新穎性而無效。"}];
let currentIndex = 0;

function escapeHtml(s) {
    return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function inlineFormat(text) {
    let s = escapeHtml(text);

    s = s.replace(/\*\*(.+?)\*\*/g, '<span class="md-strong">$1</span>');
    s = s.replace(/`([^`]+?)`/g, '<span class="md-inline-code">$1</span>');

    return s;
}

function renderMarkdownLike(text) {
    if (!text || !text.trim()) {
        return '<div class="md-p">(empty)</div>';
    }

    const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
    const lines = normalized.split("\n");
    let html = "";
    let inCodeBlock = false;
    let codeBuffer = [];
    let inUl = false;
    let inOl = false;

    function closeLists() {
        if (inUl) {
            html += '</ul>';
            inUl = false;
        }
        if (inOl) {
            html += '</ol>';
            inOl = false;
        }
    }

    function flushCode() {
        if (codeBuffer.length > 0) {
            html += '<pre class="md-codeblock">' + escapeHtml(codeBuffer.join("\n")) + '</pre>';
            codeBuffer = [];
        }
    }

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed.startsWith("```")) {
            closeLists();
            if (!inCodeBlock) {
                inCodeBlock = true;
                codeBuffer = [];
            } else {
                inCodeBlock = false;
                flushCode();
            }
            continue;
        }

        if (inCodeBlock) {
            codeBuffer.push(line);
            continue;
        }

        if (trimmed === "---") {
            closeLists();
            html += '<hr class="md-hr">';
            continue;
        }

        if (trimmed === "") {
            closeLists();
            html += '<div class="md-p"></div>';
            continue;
        }

        if (trimmed.startsWith("### ")) {
            closeLists();
            html += '<div class="md-h3">' + inlineFormat(trimmed.slice(4)) + '</div>';
            continue;
        }

        if (trimmed.startsWith("## ")) {
            closeLists();
            html += '<div class="md-h2">' + inlineFormat(trimmed.slice(3)) + '</div>';
            continue;
        }

        if (trimmed.startsWith("# ")) {
            closeLists();
            html += '<div class="md-h1">' + inlineFormat(trimmed.slice(2)) + '</div>';
            continue;
        }

        if (/^[-*]\s+/.test(trimmed)) {
            if (inOl) {
                html += '</ol>';
                inOl = false;
            }
            if (!inUl) {
                html += '<ul class="md-list">';
                inUl = true;
            }
            html += '<li>' + inlineFormat(trimmed.replace(/^[-*]\s+/, "")) + '</li>';
            continue;
        }

        if (/^\d+\.\s+/.test(trimmed)) {
            if (inUl) {
                html += '</ul>';
                inUl = false;
            }
            if (!inOl) {
                html += '<ol class="md-list">';
                inOl = true;
            }
            html += '<li>' + inlineFormat(trimmed.replace(/^\d+\.\s+/, "")) + '</li>';
            continue;
        }

        closeLists();
        html += '<div class="md-p">' + inlineFormat(line) + '</div>';
    }

    if (inCodeBlock) {
        flushCode();
    }
    closeLists();

    return html;
}

function render() {
    const status = document.getElementById("status");
    const viewer = document.getElementById("viewer");

    if (!records.length) {
        status.textContent = "0 / 0";
        viewer.innerHTML = '<div class="empty-state">沒有 ai_check 非空的專利分析結果。</div>';
        return;
    }

    const rec = records[currentIndex];
    status.textContent = 'Total: ' + records.length + ' | Current: ' + (currentIndex + 1) + ' / ' + records.length;

    viewer.innerHTML = `
        <div class="card">
            <div class="card-header">
                <div class="pat-no">${escapeHtml(rec.pat_no || "(empty pat_no)")}</div>
            </div>
            <div class="card-body">
                ${renderMarkdownLike(rec.ai_check || "")}
            </div>
        </div>
    `;
}

document.addEventListener("keydown", function(e) {
    if (!records.length) return;

    if (e.key === "ArrowRight") {
        if (currentIndex < records.length - 1) {
            currentIndex += 1;
            render();
        }
    } else if (e.key === "ArrowLeft") {
        if (currentIndex > 0) {
            currentIndex -= 1;
            render();
        }
    }
});

render();
</script>
