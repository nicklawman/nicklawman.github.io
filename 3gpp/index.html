<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>3GPP Specification Explorer</title>

        <!-- Bootstrap + Tabulator -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator.min.css"
            rel="stylesheet"
        />

        <style>
            body {
                background-color: #f8f9fa;
            }
            .table-container {
                background: white;
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            }
        </style>
    </head>
    <body>
        <div class="container py-5">
            <h1 class="mb-4">3GPP Specification Explorer</h1>

            <!-- Level Filter -->
            <div class="card mb-4">
                <div class="card-body">
                    <h5 class="card-title">Filter by Importance Level</h5>
                    <div class="d-flex flex-wrap gap-3">
                        <div class="form-check form-check-inline">
                            <input
                                class="form-check-input level-check"
                                type="checkbox"
                                value="1"
                                id="level1"
                                checked
                            />
                            <label class="form-check-label" for="level1"
                                >Level 1 (Kernel)</label
                            >
                        </div>
                        <div class="form-check form-check-inline">
                            <input
                                class="form-check-input level-check"
                                type="checkbox"
                                value="2"
                                id="level2"
                                checked
                            />
                            <label class="form-check-label" for="level2"
                                >Level 2 (Mini)</label
                            >
                        </div>
                        <div class="form-check form-check-inline">
                            <input
                                class="form-check-input level-check"
                                type="checkbox"
                                value="3"
                                id="level3"
                                checked
                            />
                            <label class="form-check-label" for="level3"
                                >Level 3 (Core)</label
                            >
                        </div>
                    </div>
                    <button id="applyFilter" class="btn btn-primary mt-3">
                        Apply Filters
                    </button>
                    <button
                        id="resetFilter"
                        class="btn btn-outline-secondary mt-3 ms-2"
                    >
                        Show All Levels
                    </button>
                </div>
            </div>

            <!-- Tabulator Table -->
            <div class="table-container p-3">
                <div id="specTable"></div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
        <script src="3gpp.js"></script>
        <!-- ← Your exported data -->
        <script>
            let table;

            function filterAndLoadTable() {
                const checked = Array.from(
                    document.querySelectorAll(".level-check:checked"),
                ).map((cb) => parseInt(cb.value));

                let filteredData = specsData;
                if (checked.length > 0 && checked.length < 3) {
                    filteredData = specsData.filter((row) =>
                        checked.includes(row.importance_level),
                    );
                }

                if (table) table.destroy();

                table = new Tabulator("#specTable", {
                    height: "700px",
                    layout: "fitColumns",
                    data: filteredData,
                    columns: [
                        { title: "Spec No.", field: "spec_no", width: 130 },
                        { title: "Title", field: "title", minWidth: 350 },
                        { title: "Layer", field: "tech_layer", width: 110 },
                        {
                            title: "Description",
                            field: "layman_desc",
                            minWidth: 300,
                        },
                        { title: "Version", field: "version", width: 120 },
                        {
                            title: "Release Date",
                            field: "release_date",
                            width: 140,
                        },
                        {
                            title: "Level",
                            field: "importance_level",
                            width: 90,
                            hozAlign: "center",
                            formatter: (cell) => {
                                const v = cell.getValue();
                                return `<span class="badge bg-${v === 1 ? "danger" : v === 2 ? "primary" : "success"}">${v}</span>`;
                            },
                        },
                        {
                            title: "Download",
                            field: "url",
                            width: 110,
                            formatter: "link",
                            formatterParams: { label: "ZIP", target: "_blank" },
                        },
                    ],
                });
            }

            // Initial load
            document.addEventListener("DOMContentLoaded", () => {
                filterAndLoadTable();

                document
                    .getElementById("applyFilter")
                    .addEventListener("click", filterAndLoadTable);
                document
                    .getElementById("resetFilter")
                    .addEventListener("click", () => {
                        document
                            .querySelectorAll(".level-check")
                            .forEach((cb) => (cb.checked = true));
                        filterAndLoadTable();
                    });
            });
        </script>
    </body>
</html>
