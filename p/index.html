                        zh: "新橋",
                        desc: "橫跨塞納河最古老的橋，石面具與浪漫氛圍。",

            };

            let currentMarkers = [];
            let currentPolyline;

            function showDay(day) {
                currentMarkers.forEach((m) => map.removeLayer(m));
                if (currentPolyline) map.removeLayer(currentPolyline);
                currentMarkers = [];

                const places = DAYS[day] || [];
                const latlngs = [];

                places.forEach((p, i) => {
                    if (!p.lat || !p.lon) return; // 防呆
                    latlngs.push([p.lat, p.lon]);
                    const title = `${p.en} (${p.zh})`;
                    let html = `<h3>${title}</h3><p>${p.desc}</p>`;
                    if (day !== "All") {
                        html += `<p><strong>上午：</strong> ${p.morning || "－"}</p>`;
                        html += `<p><strong>下午：</strong> ${p.afternoon || "－"}</p>`;
                        html += `<p><strong>晚上：</strong> ${p.evening || "－"}</p>`;
                        const icon = L.divIcon({
                            className: "num-marker",
                            html: String(i + 1).padStart(2, "0"),
                            iconSize: [34, 34],
                            iconAnchor: [17, 17],
                        });
                        const m = L.marker([p.lat, p.lon], {
                            icon,
                            title,
                        }).addTo(map);
                        m.bindPopup(html, { maxWidth: 360 });
                        currentMarkers.push(m);
                    } else {
                        const m = L.marker([p.lat, p.lon]).addTo(map);
                        m.bindPopup(html, { maxWidth: 360 });
                        currentMarkers.push(m);
                    }
                });

                if (latlngs.length > 1 && day !== "All") {
                    currentPolyline = L.polyline(latlngs, {
                        color: "#0A84FF",
                        weight: 4,
                        opacity: 0.8,
                    }).addTo(map);
                    map.fitBounds(currentPolyline.getBounds(), {
                        padding: [80, 80],
                    });
                } else if (latlngs.length > 0) {
                    map.fitBounds(L.latLngBounds(latlngs), {
                        padding: [80, 80],
                    });
                } else {
                    map.setView([48.8566, 2.3522], 12);
                }
            }

            document
                .getElementById("daySelect")
                .addEventListener("change", (e) => showDay(e.target.value));
            showDay("3/6"); // 預設顯示第一天
        </script>
    </body>
</html>
